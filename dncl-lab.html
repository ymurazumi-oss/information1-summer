p:14px;align-items:flex-start;margin-bottom:12px}.taskbar h2{margin:0 0 5px;font-size:21px}.question{margin:0;color:#49556e}.task-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.task-nav{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;color:#34445f;font-weight:800;cursor:pointer}.task-nav:disabled{opacity:.38;cursor:default}.quick-nav{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff}.quick-nav button{min-width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:#4b5870;font-weight:800;cursor:pointer}.quick-nav button:hover{background:#edf4fb}.quick-nav button.active{background:var(--navy);color:#fff}.badge{white-space:nowrap;padding:6px 10px;border-radius:999px;background:#e7eefb;color:#244879;font-size:12px;font-weight:800}.stage{display:grid;grid-template-columns:minmax(470px,1.35fr) minmax(330px,.85fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(33,48,77,.05)}.panel-head{display:flex;justify-content:space-between;padding:10px 14px;background:#edf1f6;color:#46516a;font-size:12px;font-weight:800}.edit-guide{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfdff}.edit-guide b{color:#116694}.dirty{display:none;color:var(--amber);font-size:12px;font-weight:700}.dirty.show{display:inline}.code{padding:12px;background:#101b2e;color:#e9f0fa;font:15px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:250px}.line{position:relative;padding:3px 8px 3px 42px;border-radius:5px;white-space:pre-wrap}.line:before{content:attr(data-n);position:absolute;left:8px;width:22px;text-align:right;color:#71809a}.line.done{color:#aebbd0}.line.now{background:#263d63;color:#fff}.line.now:after{content:'▶';position:absolute;left:2px;color:#55c7ff}.edit{min-width:48px;max-width:95px;padding:2px 6px;border:1px solid #65b9e8;border-radius:5px;background:var(--cyan);color:#10233f;font:inherit;text-align:center}.edit.array{width:180px;max-width:52%}select.edit{min-width:62px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid #263750;background:#16243b}.btn{border:0;border-radius:7px;padding:9px 12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.light{background:#fff;color:#243550}.btn.dark{background:#274a75;color:#fff}.btn.blue{background:#1684c5;color:#fff}.progress{flex:1;min-width:80px;height:7px;border-radius:9px;background:#465872;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#53c8ff}.counter{color:#dce7f6;font-size:12px}.hint{padding:12px 14px;background:#fff8e5;color:#76500d;font-size:13px}.side{display:grid;grid-template-rows:auto 1fr}.prediction{padding:14px;border-bottom:1px solid var(--line);background:#f9fcff}.prediction label{display:block;margin-bottom:7px;font-weight:800}.predict-row{display:flex;gap:7px}.predict-row input{min-width:0;flex:1;padding:9px;border:1px solid #aebbd0;border-radius:7px}.feedback{min-height:22px;margin-top:7px;font-size:12px;font-weight:700}.view-tabs{display:flex;gap:6px;padding:11px 12px 0}.view-tab{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;color:#536079;font-weight:800;cursor:pointer}.view-tab.active{background:#e9f4ff;border-color:#75b9e7;color:#155f91}.view{padding:12px}.view h3{margin:0 0 8px;font-size:14px}.array-card{margin-bottom:12px}.array-name{font:700 13px ui-monospace,monospace;margin-bottom:4px}.array-grid{display:flex;overflow:auto}.cell{min-width:48px;text-align:center}.cell .idx{padding:2px;color:#7b879e;font:11px ui-monospace,monospace}.cell .val{padding:7px;border:1px solid var(--line);border-right:0;background:#fff;font:700 14px ui-monospace,monospace}.cell:last-child .val{border-right:1px solid var(--line)}.cell.focus .val{background:#bdeaff;border-color:#4aaee2;box-shadow:inset 0 0 0 1px #4aaee2}.focus-note{margin-top:5px;color:#126b9e;font:700 12px ui-monospace,monospace}.vars{width:100%;border-collapse:collapse;margin-bottom:12px}.vars th,.vars td{padding:7px 8px;border-bottom:1px solid #edf0f5;text-align:left;font:13px ui-monospace,monospace}.vars th{width:42%;color:#58657d}.changed{display:inline-block;padding:2px 6px;border-radius:5px;background:#fff2a8;color:#594400}.log{padding:10px;border-left:4px solid #61b6e6;background:#eef8ff;color:#244663;font-size:13px;line-height:1.55}.screen{min-height:48px;padding:10px;border-radius:7px;background:#101b2e;color:#fff;white-space:pre-wrap;font:14px/1.55 ui-monospace,monospace}.trace-wrap{overflow:auto;max-height:430px}.trace{width:100%;border-collapse:collapse;font-size:12px}.trace th,.trace td{padding:7px;border:1px solid var(--line);text-align:left;vertical-align:top}.trace th{position:sticky;top:0;background:#edf2f8}.trace td:first-child{text-align:center}.note{padding:8px 14px;border-top:1px solid var(--line);color:#7a8497;font-size:11px;background:#fbfcfe}
.exercise-nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.exercise-nav button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;font-weight:800;color:#34445f}.exercise-nav button:disabled{opacity:.4}.feedback.error{padding:7px 9px;border-radius:6px;background:#fff0ee;color:#a33225!important}

<body>
<header class="top"><div><h1>DNCL ステップ実行</h1><small>Information I / Programming</small></div><div class="top-actions"><button class="exercise-toggle" id="exerciseToggle" type="button" aria-expanded="true">問題一覧を閉じる</button><small>情報Ⅰ 共通テスト演習</small></div></header>
<nav class="tabs" id="tabs"></nav>
<main class="workspace" id="workspace">
<aside class="left"><div class="kicker" id="round"></div><h2 id="lessonTitle"></h2><p class="goal" id="goal"></p><div class="exercise-list" id="exerciseList"></div><div class="exercise-nav"><button id="prevExercise">← 前</button><button id="nextExercise">次 →</button></div><div class="howto"><b>操作</b><br>水色：入力値<br>▶：次に実行する行<br>黄色：直前に変化した値<br><span style="color:#9a5c00">入力エラーは該当内容を表示し、実行を停止します。</span></div></aside>
<section class="main"><div class="taskbar"><div><h2 id="taskTitle"></h2><p class="question" id="question"></p></div><div class="task-actions"><span class="badge" id="concept"></span><button class="task-nav" id="prevExerciseMain" type="button">← 前の問題</button><div class="quick-nav" id="quickNav" aria-label="問題番号"></div><button class="task-nav" id="nextExerciseMain" type="button">次の問題 →</button></div></div>
<div class="stage"><section class="panel"><div class="panel-head"><span>PROGRAM</span><span>▶ NEXT LINE</span></div><div class="edit-guide"><span><b>入力値</b>　<span class="dirty" id="dirty">● 未反映</span></span><button class="btn light" id="restore">初期値</button></div><div class="code" id="code"></div><div class="controls"><button class="btn light" id="reset">↺ リセット</button><button class="btn light" id="back">← 戻る</button><button class="btn dark" id="next">ステップ実行 →</button><button class="btn blue" id="auto">連続実行</button><div class="progress"><i id="bar"></i></div><span class="counter" id="counter"></span></div><div class="hint" id="hint"></div><div class="note">DNCLの考え方に合わせた学習用表記です。</div></section>
<section class="panel side"><div class="prediction"><label for="prediction">実行前の予想</label><div class="predict-row"><input id="prediction" autocomplete="off" placeholder="表示される結果"><button class="btn blue" id="check">予想を設定</button></div><div class="feedback" id="feedback"></div></div><div><div class="view-tabs"><button class="view-tab active" data-view="current">現在値</button><button class="view-tab" data-view="trace">実行履歴</button></div><div class="view" id="currentView"><div id="arrays"></div><h3>変数</h3><table class="vars"><tbody id="vars"></tbody></table><h3>処理</h3><div class="log" id="log">未実行</div><h3 style="margin-top:12px">出力</h3><div class="screen" id="outputScreen">—</div></div><div class="view" id="traceView" hidden><div class="trace-wrap"><table class="trace"><thead><tr><th>回</th><th>行</th><th>処理</th><th>実行後の値</th></tr></thead><tbody id="traceBody"></tbody></table></div></div></div></section></div></section></main>
<script>
const E=(key,value,type=typeof value==='number'?'number':'text',options=[])=>({key,value,type,options});
const lessons=[
 {title:'一行ずつ動かす',goal:'第1回 問題1〜8｜初期値は配布資料と共通',items:[
  {title:'問題1　代入と表示',concept:'代入',question:'x・yの変更とgoukeiの関係',hint:'右辺を計算してから左辺へ代入する。',fields:[E('x',5),E('y',100)],build:buildAdd},
  {title:'問題2　変数の上書き',concept:'上書き',question:'各行の実行後におけるxの値',hint:'右辺のxは、その行を実行する直前の値。',fields:[E('start',3),E('add',5),E('mul',2),E('sub',4)],build:buildChain},
  {title:'問題3　商と余り',concept:'整数演算',question:'a・bの変更と商・余りの関係',hint:'a = b×商 + 余り。',fields:[E('a',17),E('b',5)],build:buildQuotient},
  {title:'問題4　合否判定',concept:'条件分岐',question:'境界値60における判定',hint:'>= は境界の値を含む。',fields:[E('score',68),E('cut',60)],build:buildPass},
  {title:'問題5　3段階の判定',concept:'多分岐',question:'条件の順序・境界値・表示結果の関係',hint:'順序変更後は「60以上→B」「80以上→A」にする。上から最初に成立した枝だけを行う。',fields:[E('score',78),E('first',80),E('firstLabel','A','select',['A','B']),E('second',60),E('secondLabel','B','select',['A','B'])],build:buildBranchOrder},
  {title:'問題6　1からnの合計',concept:'繰り返し',question:'終点・初期値・加算式の変更',hint:'初期値に、各回の加算が積み重なる。',fields:[E('n',5),E('initial',0),E('factor',1)],build:buildSumPlus},
  {title:'問題7　倍数だけ合計',concept:'反復＋分岐',question:'比較演算子による集計対象の違い',hint:'i % divisor が0と等しいか、等しくないかを調べる。',fields:[E('n',20),E('divisor',5),E('cmp','==','select',['==','!='])],build:buildMultipleSum},
  {title:'問題8　条件を変えて合計',concept:'完成問題',question:'各空欄が集計結果に与える影響',hint:'元の問題は initial=0、n=10、divisor=2、remainder=0、factor=1。',fields:[E('initial',0),E('n',10),E('divisor',2),E('remainder',0),E('factor',1)],build:buildRemainderSum}
 ]},
 {title:'配列を順に追う',goal:'第2回 問題1〜6＋令和7年追試｜配布資料と原題の処理に対応',items:[
  {title:'問題1　添字と要素',concept:'配列参照',question:'添字と要素の対応',hint:'先頭の添字は0。',fields:[E('data','12, 7, 20, 5','array'),E('index',2)],build:buildArrayRead},
  {title:'問題2　要素の更新',concept:'配列更新',question:'指定要素の更新',hint:'Data[index]だけを上書きする。',fields:[E('data','4, 9, 2','array'),E('index',1),E('add',3)],build:buildArrayAdd},
  {title:'問題3　すべて表示',concept:'配列＋反復',question:'iとData[i]の対応',hint:'iは0から要素数-1まで動く。',fields:[E('data','6, 3, 8, 4','array')],build:buildArrayDisplay},
  {title:'問題4　偶数だけ集計',concept:'条件つき集計',question:'条件を満たす要素の集計',hint:'条件が偽の回は合計が変わらない。',fields:[E('data','4, 7, 10, 3, 8','array'),E('divisor',2),E('remainder',0)],build:buildArrayConditionalSum},
  {title:'問題5　1人分の情報',concept:'複数配列',question:'複数配列における同一添字の対応',hint:'同じ添字は同じ人を表す。',fields:[E('types','1, 2, 1, 3','array'),E('weights','4, 7, 5, 2','array'),E('index',2)],build:buildParallel},
  {title:'問題6　種類別の重さ',concept:'複数配列＋集計',question:'種類番号から配列添字への変換',hint:'種類1〜3を添字0〜2へ直すため1を引く。',fields:[E('types','1, 2, 1, 3','array'),E('weights','4, 7, 5, 2','array'),E('groups',3)],build:buildCategoryTotal},
  {title:'原題　ごみ拾い（先頭5人）',concept:'令和7年追試',question:'入れ物の重さを除き、可燃・不燃ごとに集計する',hint:'原題の図3・図4に対応。原題は40人分だが、ラボでは掲載値がそろう先頭5人を同じ処理で追う。添字は原題に合わせて1から始める。',fields:[E('containers','2, 1, 1, 1, 2','array'),E('types','1, 2, 2, 1, 1','array'),E('weights','112, 1224, 717, 1206, 303','array'),E('bucketWeight',350)],build:buildGarbageExam}
 ]},
 {title:'最大値と待ち時間',goal:'第3回 問題1〜5＋令和8年本試｜配列・時刻更新・最大値',items:[
  {title:'問題1　直前の終了時刻',concept:'配列＋時刻',question:'1人目の開始時刻と終了時刻',hint:'配布資料どおり、Touchaku・Kaishi・Shuryouは配列、Taikenは数値として扱う。',fields:[E('arrival','0, 4, 10','array'),E('duration',6)],build:buildFirstServiceArray},
  {title:'問題2　到着と前の終了を比較',concept:'配列＋比較',question:'2人目の開始時刻と待ち時間',hint:'Touchaku[1]とShuryou[0]の大きい方がKaishi[1]になる。',fields:[E('arrival','0, 4, 10','array'),E('duration',6)],build:buildSecondServiceArray},
  {title:'問題3　最大値と位置',concept:'最大値探索',question:'最大値と添字の同時更新',hint:'値を更新するとき、位置も同時に更新する。',fields:[E('data','5, 9, 4, 12, 7','array'),E('op','>','select',['>','>='])],build:buildExtremePos},
  {title:'問題4　同じ最大値',concept:'比較記号',question:'比較演算子と最大値の位置',hint:'同値のときに更新するかどうかが違う。',fields:[E('data','9, 4, 9, 7','array'),E('op','>','select',['>','>='])],build:buildExtremePos},
  {title:'問題5　全員の待ち時間',concept:'配列＋時刻更新',question:'開始・終了・待ち時間の配列更新',hint:'開始は到着と直前終了の大きい方。',fields:[E('arrival','0, 4, 10','array'),E('duration','6, 3, 5','array')],build:buildWaitFull},
  {title:'原題　待ち時間',concept:'令和8年本試',question:'原題の到着時刻配列と体験時間で待ち時間を追う',hint:'原題の図2に対応。Touchaku=[0,3,4,10,11,12]、taiken=3で、2人目以降を順に処理する。',fields:[E('arrival','0, 3, 4, 10, 11, 12','array'),E('duration',3)],build:buildWaitExam}
 ]},
 {title:'長いプログラム',goal:'第4回 問題1〜5＋令和7年本試｜探索・割当・更新',items:[
  {title:'問題1　二重ループ',concept:'二重ループ',question:'二重ループの実行順序',hint:'表示される(i,j)の順番を見る。',fields:[E('outer',3),E('inner',2)],build:buildNestedDisplay},
  {title:'問題2　最小値と担当',concept:'最小値探索',question:'同値を含む最小値探索',hint:'< では最初に見つけた位置が残る。',fields:[E('akibi','6, 3, 3, 5','array'),E('op','<','select',['<','<='])],build:buildMinPos},
  {title:'問題3　比較記号を変更',concept:'同値の扱い',question:'比較演算子と担当者の選択',hint:'<= では同値でも後の位置へ更新する。',fields:[E('akibi','6, 3, 3, 5','array'),E('op','<=','select',['<','<='])],build:buildMinPos},
  {title:'問題4　空き日の更新',concept:'配列更新',question:'担当者の空き日の更新',hint:'更新するのはAkibi[tantou]だけ。',fields:[E('akibi','6, 3, 3, 5','array'),E('tantou',1),E('days',4)],build:buildAvailabilityUpdate},
  {title:'問題5　複数の割り当て',concept:'探索＋更新',question:'探索と更新の反復',hint:'外側は工芸品、内側は担当者探索。',fields:[E('akibi','6, 3, 3, 5','array'),E('nissu','4, 2','array'),E('op','<','select',['<','<='])],build:buildAssign},
  {title:'原題　工芸品の担当',concept:'令和7年本試',question:'原題の制作日数で部員3人への割当を追う',hint:'原題の図5に対応。添字は原題に合わせて1から始め、最も早く空く部員を選ぶ。',fields:[E('akibi','1, 1, 1','array'),E('nissu','4, 1, 3, 1, 3, 4, 2, 4, 3','array')],build:buildCraftExam}
 ]}
];
function clamp(v,a,b){v=parseInt(v,10);return Number.isFinite(v)?Math.max(a,Math.min(b,v)):a}
function arrayOf(v){const a=String(v).split(/[、,\s]+/).filter(Boolean).map(Number).filter(Number.isFinite);return (a.length?a:[0]).slice(0,12)}
function compare(a,op,b){return ({'>':a>b,'<':a<b,'>=':a>=b,'<=':a<=b,'==':a==b})[op]}

function readEditors(){document.querySelectorAll('.edit').forEach(el=>draft[taskKey()][el.dataset.key]=el.value)}
function strictArray(v){const parts=String(v).split(/[、,\s]+/).filter(Boolean);return parts.length&&parts.every(x=>Number.isFinite(Number(x)))?parts.map(Number):null}
const FIELD_LABELS={start:'xの初期値',add:'加える数',mul:'掛ける数',sub:'引く数',a:'a',b:'b',score:'tokuten',cut:'判定基準',first:'最初の判定基準',second:'次の判定基準',n:'繰り返し回数',initial:'goukeiの初期値',factor:'加える倍率',divisor:'割る数',remainder:'余り',data:'Data',index:'添字',value:'代入する値',types:'Shurui',weights:'Omosa／Keiryou',groups:'種類数',containers:'Iremono',bucketWeight:'バケツの重さ',arrival:'Touchaku',duration:'Taiken',outer:'外側の回数',inner:'内側の回数',akibi:'Akibi',tantou:'担当者の添字',days:'Nissu',nissu:'Nissu'};
function fieldLabel(k){return FIELD_LABELS[k]||k}
function validateDraft(){
 const d=draft[taskKey()],fs=item().fields,ft=Object.fromEntries(fs.map(f=>[f.key,f.type])),av={};
 for(const f of fs){const raw=d[f.key];if(f.type==='number'){if(String(raw??'').trim()==='')return `${fieldLabel(f.key)}を入力してください。`;if(!Number.isFinite(Number(raw)))return `${fieldLabel(f.key)}には数値を入力してください。`}if(f.type==='array'){const a=strictArray(raw);if(!a)return `${fieldLabel(f.key)}には数値をカンマ区切りで入力してください。`;if(a.length>12)return `${fieldLabel(f.key)}の要素数は12個以内にしてください。`;av[f.key]=a}}
 for(const k of ['a','b','n','groups','outer','inner','index','tantou','divisor','remainder'])if(k in d&&!Number.isInteger(Number(d[k])))return `${fieldLabel(k)}には整数を入力してください。`;
 for(const k of ['b','n','groups','outer','inner','divisor'])if(k in d&&Number(d[k])<1)return `${fieldLabel(k)}は1以上にしてください。`;
 for(const k of ['duration','days','bucketWeight'])if(k in d&&ft[k]==='number'&&Number(d[k])<=0)return `${fieldLabel(k)}は0より大きい値にしてください。`;
 if('n'in d&&Number(d.n)>30)return '繰り返し回数は30以下にしてください。';
 for(const k of ['outer','inner'])if(k in d&&Number(d[k])>10)return `${fieldLabel(k)}は10以下にしてください。`;
 if('groups'in d&&Number(d.groups)>8)return '種類数は8以下にしてください。';
 if('remainder'in d){const div=Number(d.divisor);if(Number(d.remainder)<0||Number(d.remainder)>=div)return `余りは0以上${div-1}以下にしてください。`}
 if('index'in d){const source='data'in d?av.data:av.types;if(source&&(Number(d.index)<0||Number(d.index)>=source.length))return `添字は0〜${source.length-1}の整数にしてください。`}
 if(av.akibi&&'tantou'in d&&(Number(d.tantou)<0||Number(d.tantou)>=av.akibi.length))return `担当者の添字は0〜${av.akibi.length-1}の整数にしてください。`;
 for(const [a,b,label] of [['types','weights','ShuruiとOmosa'],['arrival','duration','TouchakuとTaiken'],['containers','types','IremonoとShurui'],['containers','weights','IremonoとKeiryou']])if(av[a]&&av[b]&&ft[a]==='array'&&ft[b]==='array'&&av[a].length!==av[b].length)return `${label}の要素数を同じにしてください。`;
 if(av.arrival){if(av.arrival.some(x=>x<0))return 'Touchakuには0以上の時刻を入力してください。';if(av.arrival.some((x,i,a)=>i>0&&x<a[i-1]))return 'Touchakuは到着順に小さい値から入力してください。'}
 if([buildSecondServiceArray,buildWaitExam].includes(item().build)&&av.arrival.length<2)return '2人目以降を計算するため、Touchakuを2要素以上入力してください。';
 if(item().build===buildWaitExam&&av.arrival[0]!==0)return '原題の処理では、Touchakuの先頭を0にしてください。';
 if(av.duration&&av.duration.some(x=>x<=0))return 'Taikenの各要素は0より大きい値にしてください。';
 if(av.weights&&av.weights.some(x=>x<0))return `${fieldLabel('weights')}には0以上の値を入力してください。`;
 if(av.akibi&&av.akibi.some(x=>!Number.isInteger(x)||x<0))return 'Akibiには0以上の整数を入力してください。';
 if(av.nissu&&av.nissu.some(x=>!Number.isInteger(x)||x<1))return 'Nissuには1以上の整数を入力してください。';
 if(av.types&&!av.containers&&av.types.some(x=>!Number.isInteger(x)||x<1))return 'Shuruiには1以上の整数を入力してください。';
 if(av.types&&'groups'in d){const g=Number(d.groups);if(av.types.some(x=>!Number.isInteger(x)||x<1||x>g))return `種類番号は1〜${g}の整数にしてください。`}
 if(av.containers&&av.containers.some(x=>x!==1&&x!==2))return 'Iremonoは1（バケツ）または2（ごみ袋）で入力してください。';
 if(av.containers&&av.types.some(x=>x!==1&&x!==2))return 'Shuruiは1（可燃）または2（不燃）で入力してください。';
 if(av.containers&&av.weights){const bw=Number(d.bucketWeight);if(av.weights.some((x,i)=>av.containers[i]===1&&x<bw))return 'バケツの計量値は、バケツ自体の重さ以上にしてください。'}
 return ''
}
function showValidation(msg){validationError=msg;feedback.classList.add('error');feedback.textContent=msg}
function clearValidation(){validationError='';feedback.classList.remove('error')}
function clearFeedback(){clearValidation();feedback.textContent='';feedback.style.color=''}
function commitDraft(){readEditors();const msg=validateDraft();if(msg){showValidation(msg);return false}clearValidation();if(!changed())return false;active[taskKey()]={...draft[taskKey()]};step=0;stop();return true}
function stateAt(b){return step?b.frames[step-1]:{vars:{},log:'未実行'}}
function norm(x){return String(x??'').replace(/[\s　]+/g,'').replace(/，/g,',').trim()}
function samePrediction(a,b){if(norm(a)===norm(b))return true;const nums=x=>(String(x).match(/-?\d+(?:\.\d+)?/g)||[]).map(Number),x=nums(a),y=nums(b);return x.length>0&&x.length===y.length&&x.every((v,i)=>v===y[i])}
function finalFeedback(b){if(step<b.frames.length||!pred)return;const actual=b.frames.findLast(f=>f.out!==undefined)?.out??'';if(samePrediction(pred,actual)){feedback.style.color='var(--green)';feedback.textContent='予想と実行結果が一致しました。'}else{feedback.style.color='#b1432d';feedback.textContent=`予想：${pred} ／ 実際：${actual}。実行履歴から差が生じた行を確認できます。`}}
function returnToLabTop(){requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))}
function chooseExercise(i){ei=i;step=0;pred='';view='current';clearFeedback();stop();render();returnToLabTop()}
function nav(){tabs.innerHTML=lessons.map((l,i)=>`<button class="tab ${i===li?'active':''}" data-i="${i}">第${i+1}回　${l.title}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{li=+b.dataset.i;ei=0;step=0;pred='';view='current';clearFeedback();stop();render();returnToLabTop()});exerciseList.innerHTML=lessons[li].items.map((x,i)=>`<button class="exercise ${i===ei?'active':''}" data-i="${i}"><strong>${i+1}. ${x.title}</strong><span>${x.concept}</span></button>`).join('');exerciseList.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseExercise(+b.dataset.i));quickNav.innerHTML=lessons[li].items.map((x,i)=>`<button class="${i===ei?'active':''}" type="button" aria-label="問題${i+1}へ" aria-current="${i===ei?'true':'false'}">${i+1}</button>`).join('');quickNav.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>chooseExercise(i));const atFirst=ei===0,atLast=ei===lessons[li].items.length-1;[['#prevExercise',atFirst,ei-1],['#prevExerciseMain',atFirst,ei-1],['#nextExercise',atLast,ei+1],['#nextExerciseMain',atLast,ei+1]].forEach(([selector,disabled,target])=>{const button=$(selector);button.disabled=disabled;button.onclick=()=>chooseExercise(target)})}
function renderArrays(st){const entries=Object.entries(st.vars||{}).filter(([,v])=>Array.isArray(v));arrays.innerHTML=entries.map(([name,a])=>{const focus=st.focus?.name===name?st.focus.index:-1,start=a[0]==='—'?1:0,cells=a.slice(start).map((v,j)=>{const i=j+start;return `<div class="cell ${i===focus?'focus':''}"><div class="idx">${i}</div><div class="val">${esc(v)}</div></div>`}).join('');return `<div class="array-card"><div class="array-name">${esc(name)}</div><div class="array-grid">${cells}</div>${focus>=start?`<div class="focus-note">${esc(name)}[${focus}] = ${esc(a[focus])}</div>`:''}</div>`}).join('')}
function valueText(vars){return Object.entries(vars||{}).filter(([,v])=>!Array.isArray(v)).map(([k,v])=>`${k}=${v}`).join('，')||'—'}
function renderTrace(b){traceBody.innerHTML=step?b.frames.slice(0,step).map((f,i)=>`<tr><td>${i+1}</td><td>${f.line+1}</td><td>${esc(f.log)}</td><td>${esc(valueText(f.vars))}${f.out!==undefined?`<br>出力=${esc(f.out)}`:''}</td></tr>`).join(''):'<tr><td colspan="4" style="color:#7b879e">実行履歴はありません。</td></tr>'}
function render(){ensure();const l=lessons[li],x=item(),b=build(),st=stateAt(b),executed=new Set(b.frames.slice(0,step).map(f=>f.line)),nextLine=step<b.frames.length?b.frames[step].line:-1;round.textContent=`SECTION ${li+1} / 4`;lessonTitle.textContent=l.title;goal.textContent=l.goal;taskTitle.textContent=x.title;question.textContent=x.question;concept.textContent=`${x.concept}｜${ei+1}/${l.items.length}`;code.innerHTML=b.code.map((line,i)=>`<div class="line ${executed.has(i)?'done':''} ${i===nextLine?'now':''}" data-n="${i+1}">${codeLine(line)}</div>`).join('');code.querySelectorAll('.edit').forEach(el=>{el.oninput=e=>{draft[taskKey()][e.target.dataset.key]=e.target.value;dirty.classList.toggle('show',changed())};el.onchange=()=>dirty.classList.toggle('show',changed())});dirty.classList.toggle('show',changed());renderArrays(st);const scalar=Object.entries(st.vars||{}).filter(([,v])=>!Array.isArray(v));vars.innerHTML=scalar.length?scalar.map(([k,v])=>{const prev=step>1?b.frames[step-2]?.vars?.[k]:undefined;const shown=v===undefined?'—':v;return `<tr><th>${esc(k)}</th><td><span class="${prev!==v?'changed':''}">${esc(shown)}</span></td></tr>`}).join(''):'<tr><td style="color:#7b879e">—</td></tr>';log.textContent=st.log;outputScreen.textContent=st.out??(step?b.frames.slice(0,step).reverse().find(f=>f.out!==undefined)?.out:'')??'—';hint.innerHTML=`<b>確認事項：</b> ${esc(x.hint)}`;bar.style.width=`${b.frames.length?Math.round(step/b.frames.length*100):0}%`;counter.textContent=`${step} / ${b.frames.length}`;back.disabled=step===0;next.disabled=step>=b.frames.length;prediction.value=pred;renderTrace(b);currentView.hidden=view!=='current';traceView.hidden=view!=='trace';document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));nav();finalFeedback(b)}
function stop(){clearInterval(timer);timer=null;if($('#auto'))auto.textContent='連続実行'}
function prepareRun(){const wasChanged=commitDraft();if(validationError)return null;if(wasChanged){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初から実行します。'}return build()}
restore.onclick=()=>{active[taskKey()]=defaults();draft[taskKey()]={...active[taskKey()]};step=0;pred='';clearValidation();stop();feedback.textContent='元の設定に戻しました。';render()};reset.onclick=()=>{commitDraft();if(validationError)return;step=0;stop();feedback.textContent=pred?'予想は保持されています。':'';render()};back.onclick=()=>{stop();if(commitDraft()){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初に戻りました。';render();return}if(validationError)return;if(step>0)step--;render()};next.onclick=()=>{stop();const b=prepareRun();if(!b)return;if(step<b.frames.length)step++;render()};auto.onclick=()=>{if(timer){stop();return}let b=prepareRun();if(!b)return;render();auto.textContent='一時停止';timer=setInterval(()=>{b=build();if(step>=b.frames.length){stop();render();return}step++;render()},650)};
const workspaceEl=document.getElementById('workspace'),exerciseToggle=document.getElementById('exerciseToggle');function setExerciseNav(collapsed){workspaceEl.classList.toggle('exercise-collapsed',collapsed);exerciseToggle.textContent=collapsed?'問題一覧を開く':'問題一覧を閉じる';exerciseToggle.setAttribute('aria-expanded',String(!collapsed));sessionStorage.setItem('dncl_exercise_nav',collapsed?'closed':'open')}const exerciseNavState=sessionStorage.getItem('dncl_exercise_nav');setExerciseNav(exerciseNavState?exerciseNavState==='closed':matchMedia('(max-width:1100px)').matches);exerciseToggle.onclick=()=>setExerciseNav(!workspaceEl.classList.contains('exercise-collapsed'));
check.onclick=()=>{pred=prediction.value.trim();feedback.style.color=pred?'#155eef':'#9a5c00';feedback.textContent=pred?'この予想を実行結果と比較します。':'予想を入力してください。';finalFeedback(build())};prediction.oninput=e=>pred=e.target.value;document.querySelectorAll('.view-tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName)){if(e.key==='Enter'){e.preventDefault();if(e.target===prediction)check.click();else e.target.blur()}return}if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')back.click();if(e.key.toLowerCase()==='r')reset.click()});render();
</script>
