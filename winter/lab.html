<style>
:root{--ink:#172033;--muted:#657089;--line:#dce3ee;--navy:#182b4d;--blue:#1769aa;--pale:#eaf7ff;--cyan:#d7f1ff;--green:#0a7b58;--amber:#9a5c00;--paper:#f5f7fb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 24px;background:var(--navy);color:#fff}.top h1{margin:0 0 3px;font-size:22px}.top small{opacity:.85}.top-actions{display:flex;align-items:center;gap:12px}.exercise-toggle{border:1px solid #ffffff45;border-radius:8px;background:#ffffff0c;color:#fff;padding:8px 11px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 14px;color:#46516a;font-weight:700;cursor:pointer}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.workspace{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 112px);transition:grid-template-columns .2s ease}.workspace.exercise-collapsed{grid-template-columns:0 1fr}.left{padding:20px 16px;background:#fff;border-right:1px solid var(--line);transition:transform .2s ease,opacity .2s ease;overflow:hidden}.workspace.exercise-collapsed .left{transform:translateX(-100%);opacity:0;pointer-events:none}.kicker{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.08em}.left h2{margin:5px 0 7px;font-size:20px}.goal{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.65}.exercise-list{display:grid;gap:7px}.exercise{width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.exercise strong,.exercise span{display:block}.exercise span{margin-top:3px;color:var(--muted);font-size:11px}.exercise.active{border-color:#76b8e8;background:var(--pale)}.howto{margin-top:16px;padding:12px;border-radius:9px;background:#f3f6fa;color:#49556e;font-size:12px;line-height:1.7}.main{padding:18px}.taskbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.taskbar h2{margin:0 0 5px;font-size:21px}.question{margin:0;color:#49556e}.task-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.task-nav{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;color:#34445f;font-weight:800;cursor:pointer}.task-nav:disabled{opacity:.38;cursor:default}.quick-nav{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff}.quick-nav button{min-width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:#4b5870;font-weight:800;cursor:pointer}.quick-nav button:hover{background:#edf4fb}.quick-nav button.active{background:var(--navy);color:#fff}.badge{white-space:nowrap;padding:6px 10px;border-radius:999px;background:#e7eefb;color:#244879;font-size:12px;font-weight:800}.stage{display:grid;grid-template-columns:minmax(470px,1.35fr) minmax(330px,.85fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(33,48,77,.05)}.panel-head{display:flex;justify-content:space-between;padding:10px 14px;background:#edf1f6;color:#46516a;font-size:12px;font-weight:800}.edit-guide{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfdff}.edit-guide b{color:#116694}.dirty{display:none;color:var(--amber);font-size:12px;font-weight:700}.dirty.show{display:inline}.code{padding:12px;background:#101b2e;color:#e9f0fa;font:15px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:250px}.line{position:relative;padding:3px 8px 3px 42px;border-radius:5px;white-space:pre-wrap}.line:before{content:attr(data-n);position:absolute;left:8px;width:22px;text-align:right;color:#71809a}.line.done{color:#aebbd0}.line.now{background:#263d63;color:#fff}.line.now:after{content:'▶';position:absolute;left:2px;color:#55c7ff}.edit{field-sizing:content;width:auto;min-width:4ch;max-width:min(18ch,48%);padding:2px 6px;border:1px solid #65b9e8;border-radius:5px;background:var(--cyan);color:#10233f;font:inherit;text-align:center}.edit.array{width:auto;min-width:8ch;max-width:min(46ch,70%)}select.edit{min-width:62px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid #263750;background:#16243b}.btn{border:0;border-radius:7px;padding:9px 12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.light{background:#fff;color:#243550}.btn.dark{background:#274a75;color:#fff}.btn.blue{background:#1684c5;color:#fff}.progress{flex:1;min-width:80px;height:7px;border-radius:9px;background:#465872;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#53c8ff}.counter{color:#dce7f6;font-size:12px}.hint{padding:12px 14px;background:#fff8e5;color:#76500d;font-size:13px}.side{display:grid;grid-template-rows:auto 1fr}.prediction{padding:14px;border-bottom:1px solid var(--line);background:#f9fcff}.prediction label{display:block;margin-bottom:7px;font-weight:800}.predict-row{display:flex;gap:7px}.predict-row input{min-width:0;flex:1;padding:9px;border:1px solid #aebbd0;border-radius:7px}.feedback{min-height:22px;margin-top:7px;font-size:12px;font-weight:700}.view-tabs{display:flex;gap:6px;padding:11px 12px 0}.view-tab{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;color:#536079;font-weight:800;cursor:pointer}.view-tab.active{background:#e9f4ff;border-color:#75b9e7;color:#155f91}.view{padding:12px}.view h3{margin:0 0 8px;font-size:14px}.array-card{margin-bottom:12px}.array-name{font:700 13px ui-monospace,monospace;margin-bottom:4px}.array-grid{display:flex;overflow:auto}.cell{min-width:48px;text-align:center}.cell .idx{padding:2px;color:#7b879e;font:11px ui-monospace,monospace}.cell .val{padding:7px;border:1px solid var(--line);border-right:0;background:#fff;font:700 14px ui-monospace,monospace}.cell:last-child .val{border-right:1px solid var(--line)}.cell.focus .val{background:#bdeaff;border-color:#4aaee2;box-shadow:inset 0 0 0 1px #4aaee2}.focus-note{margin-top:5px;color:#126b9e;font:700 12px ui-monospace,monospace}.vars{width:100%;border-collapse:collapse;margin-bottom:12px}.vars th,.vars td{padding:7px 8px;border-bottom:1px solid #edf0f5;text-align:left;font:13px ui-monospace,monospace}.vars th{width:42%;color:#58657d}.changed{display:inline-block;padding:2px 6px;border-radius:5px;background:#fff2a8;color:#594400}.log{padding:10px;border-left:4px solid #61b6e6;background:#eef8ff;color:#244663;font-size:13px;line-height:1.55}.screen{min-height:48px;padding:10px;border-radius:7px;background:#101b2e;color:#fff;white-space:pre-wrap;font:14px/1.55 ui-monospace,monospace}.trace-wrap{overflow:auto;max-height:430px}.trace{width:100%;border-collapse:collapse;font-size:12px}.trace th,.trace td{padding:7px;border:1px solid var(--line);text-align:left;vertical-align:top}.trace th{position:sticky;top:0;background:#edf2f8}.trace td:first-child{text-align:center}.note{padding:8px 14px;border-top:1px solid var(--line);color:#7a8497;font-size:11px;background:#fbfcfe}
.exercise-nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.exercise-nav button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;font-weight:800;color:#34445f}.exercise-nav button:disabled{opacity:.4}.feedback.error{padding:7px 9px;border-radius:6px;background:#fff0ee;color:#a33225!important}
@media(max-width:940px){.workspace{display:block}.workspace.exercise-collapsed .left{display:none}.left{border-right:0;border-bottom:1px solid var(--line)}.exercise-list{grid-template-columns:repeat(3,1fr)}.howto{display:none}.stage{grid-template-columns:1fr}.code{min-height:210px}.side{min-height:380px}}
@media(max-width:600px){.top{padding:12px 14px}.top-actions>small{display:none}.exercise-toggle{padding:7px 9px;font-size:12px}.main{padding:10px}.left{padding:14px 10px}.exercise-list{grid-template-columns:1fr}.taskbar{display:block}.task-actions{justify-content:flex-start;margin-top:9px}.task-nav{padding:8px 10px}.quick-nav{order:3;width:100%;overflow-x:auto}.quick-nav button{flex:1;min-width:34px}.badge{display:inline-block}.edit.array{max-width:68vw}.controls .progress{order:9;flex-basis:70%}}
/* iPad横向きでも、コードと実行結果を無理に横並びにしない。 */
@media(max-width:1100px){.stage{grid-template-columns:1fr}.side{min-height:360px}.edit.array{max-width:min(46ch,70vw)}}
.quick-nav button{min-width:42px;height:42px}.task-nav,.btn,.view-tab,.exercise-toggle{min-height:42px}
@media(min-width:1101px){body{min-height:0;overflow:visible}.workspace{min-height:0;overflow:visible}.left{overflow-y:visible}.main{min-height:0;display:block;overflow:visible}.stage{min-height:0;align-items:start}.stage>.panel:first-child{display:block}.stage>.panel:first-child .code{min-height:250px;overflow:visible}.stage>.panel:first-child .controls{position:relative;z-index:1}.side{height:auto;align-self:start}}
@media(max-width:600px){.quick-nav button{min-width:44px;height:44px}.edit.array{max-width:68vw}}
@media (pointer:coarse){
 .tab,.exercise,.exercise-nav button,.quick-nav button,.task-nav,.btn,.view-tab,.exercise-toggle,.edit,.predict-row input{min-height:44px}
 .edit,.predict-row input{font-size:16px}
}
</style>
</head>
<body>
<header class="top"><div><h1>DNCLステップ実行</h1><small>情報Ⅰ 冬期講習</small></div><div class="top-actions"><button class="exercise-toggle" id="exerciseToggle" type="button" aria-expanded="true">問題一覧を閉じる</button><small>情報Ⅰ 共通テスト演習</small></div></header>
<nav class="tabs" id="tabs"></nav>
<main class="workspace" id="workspace">
<aside class="left"><div class="kicker" id="round"></div><h2 id="lessonTitle"></h2><p class="goal" id="goal"></p><div class="exercise-list" id="exerciseList"></div><div class="exercise-nav"><button id="prevExercise">← 前</button><button id="nextExercise">次 →</button></div><div class="howto"><b>操作</b><br>水色：入力値<br>▶：次に実行する行<br>黄色：直前に変化した値<br><span style="color:#9a5c00">入力エラーは該当内容を表示し、実行を停止します。</span></div></aside>
<section class="main"><div class="taskbar"><div><h2 id="taskTitle"></h2><p class="question" id="question"></p></div><div class="task-actions"><span class="badge" id="concept"></span><button class="task-nav" id="prevExerciseMain" type="button">← 前の問題</button><div class="quick-nav" id="quickNav" aria-label="問題番号"></div><button class="task-nav" id="nextExerciseMain" type="button">次の問題 →</button></div></div>
<div class="stage"><section class="panel"><div class="panel-head"><span>PROGRAM</span><span>▶ NEXT LINE</span></div><div class="edit-guide"><span><b>入力値</b>　<span class="dirty" id="dirty">● 未反映</span></span><button class="btn light" id="restore">初期値</button></div><div class="code" id="code"></div><div class="controls"><button class="btn light" id="reset">↺ リセット</button><button class="btn light" id="back">← 戻る</button><button class="btn dark" id="next">ステップ実行 →</button><button class="btn blue" id="auto">連続実行</button><div class="progress"><i id="bar"></i></div><span class="counter" id="counter"></span></div><div class="hint" id="hint"></div><div class="note">DNCLの考え方に合わせた学習用表記です。</div></section>
<section class="panel side"><div class="prediction"><label for="prediction">実行前の予想</label><div class="predict-row"><input id="prediction" autocomplete="off" placeholder="表示される結果"><button class="btn blue" id="check">予想を設定</button></div><div class="feedback" id="feedback" role="status"></div></div><div><div class="view-tabs"><button class="view-tab active" data-view="current">現在値</button><button class="view-tab" data-view="trace">実行履歴</button></div><div class="view" id="currentView"><div id="arrays"></div><h3>変数</h3><table class="vars"><tbody id="vars"></tbody></table><h3>処理</h3><div class="log" id="log">未実行</div><h3 style="margin-top:12px">出力</h3><div class="screen" id="outputScreen">—</div></div><div class="view" id="traceView" hidden><div class="trace-wrap"><table class="trace"><thead><tr><th>回</th><th>行</th><th>処理</th><th>実行後の値</th></tr></thead><tbody id="traceBody"></tbody></table></div></div></div></section></div></section></main>
<script>
const E=(key,value,type=typeof value==='number'?'number':'text',options=[])=>({key,value,type,options});
const lessons=[
 {number:3,title:'分岐と繰り返し',goal:'予想を立ててから、1行ずつ確かめよう。',items:[
  {title:'合否判定',concept:'条件分岐',question:'境界値60における判定',hint:'>= は境界の値を含む。',fields:[E('score',68),E('cut',60)],build:buildPass},
  {title:'1からnの合計',concept:'繰り返し',question:'終点・初期値・加算式の変更',hint:'初期値に、各回の加算が積み重なる。',fields:[E('n',5),E('initial',0),E('factor',1)],build:buildSumPlus},
  {title:'倍数だけ合計',concept:'反復＋分岐',question:'比較演算子による集計対象の違い',hint:'i % divisor が0と等しいか、等しくないかを調べる。',fields:[E('n',20),E('divisor',5),E('cmp','==','select',['==','!='])],build:buildMultipleSum}
 ]},
 {number:4,title:'配列と最大値',goal:'添字と値をセットで追おう。',items:[
  {title:'すべて表示',concept:'配列＋反復',question:'iとData[i]の対応',hint:'iは0から要素数-1まで動く。',fields:[E('data','6, 3, 8, 4','array')],build:buildArrayDisplay},
  {title:'最大値と位置',concept:'最大値探索',question:'最大値と添字の同時更新',hint:'値を更新するとき、位置も同時に更新する。',fields:[E('data','5, 9, 4, 12, 7','array'),E('op','>','select',['>','>='])],build:buildExtremePos},
  {title:'同じ最大値',concept:'比較記号',question:'比較演算子と最大値の位置',hint:'同値のときに更新するかどうかが違う。',fields:[E('data','9, 4, 9, 7','array'),E('op','>','select',['>','>='])],build:buildExtremePos}
 ]}
];
function arrayOf(v){const a=String(v).split(/[、,\s]+/).filter(Boolean).map(Number).filter(Number.isFinite);return (a.length?a:[0]).slice(0,12)}
function compare(a,op,b){return ({'>':a>b,'<':a<b,'>=':a>=b,'<=':a<=b,'==':a==b})[op]}
function copyVars(v){const o={};for(const [k,x] of Object.entries(v||{}))o[k]=Array.isArray(x)?[...x]:x;return o}
function frame(line,vars,log,out,focus){return{line,vars:copyVars(vars),log,out,focus}}
function buildPass(s){const score=+s.score,cut=+s.cut,v={tokuten:score},ok=score>=cut,fs=[frame(0,v,`tokutenに${score}を代入`),frame(1,v,`${score} >= ${cut} は${ok?'真':'偽'}`)];fs.push(frame(ok?2:4,v,ok?'合格を表示':'不合格を表示',ok?'合格':'不合格'));return{code:['tokuten = {{score}}','もし tokuten >= {{cut}} ならば:','｜ 表示する("合格")','そうでなければ:','└ 表示する("不合格")'],frames:fs}}
function buildSumPlus(s){const n=+s.n,factor=+s.factor,v={goukei:+s.initial},fs=[frame(0,v,`goukeiを${v.goukei}で初期化`)];for(let i=1;i<=n;i++){v.i=i;fs.push(frame(1,v,`i=${i}`));v.goukei+=factor*i;fs.push(frame(2,v,`${factor}×${i}を加えて${v.goukei}`))}fs.push(frame(3,v,`${v.goukei}を表示`,String(v.goukei)));return{code:['goukei = {{initial}}','i を 1 から {{n}} まで繰り返す:','｜ goukei = goukei + {{factor}} * i','表示する(goukei)'],frames:fs}}
function buildMultipleSum(s){const b=buildRemainderSum({...s,initial:0,remainder:0,factor:1});b.code[0]='goukei = 0';b.code[3]='｜ └ goukei = goukei + i';return b}
function buildRemainderSum(s){const n=+s.n,d=Math.abs(+s.divisor),r=+s.remainder,cmp=s.cmp||'==',factor=s.factor===undefined?1:+s.factor,v={goukei:s.initial===undefined?0:+s.initial},fs=[frame(0,v,`goukeiを${v.goukei}で初期化`)];for(let i=1;i<=n;i++){v.i=i;fs.push(frame(1,v,`i=${i}`));const equal=i%d===r,ok=cmp==='!='?!equal:equal;fs.push(frame(2,v,`${i} % ${d} ${cmp} ${r} は${ok?'真':'偽'}`));if(ok){v.goukei+=factor*i;fs.push(frame(3,v,`${factor}×${i}を加えて${v.goukei}`))}}fs.push(frame(4,v,`${v.goukei}を表示`,String(v.goukei)));const condition=s.cmp!==undefined?'｜ もし i % {{divisor}} {{cmp}} 0 ならば:':'｜ もし i % {{divisor}} == {{remainder}} ならば:';const init=s.initial===undefined?'goukei = 0':'goukei = {{initial}}';const update=s.factor===undefined?'｜ └ goukei = goukei + i':'｜ └ goukei = goukei + {{factor}} * i';return{code:[init,'i を 1 から {{n}} まで繰り返す:',condition,update,'表示する(goukei)'],frames:fs}}
function buildArrayDisplay(s){const a=arrayOf(s.data),v={Data:a},fs=[frame(0,v,'配列Dataを用意')],out=[];for(let i=0;i<a.length;i++){v.i=i;fs.push(frame(1,v,`i=${i}`,undefined,{name:'Data',index:i}));out.push(`(${i}, ${a[i]})`);fs.push(frame(2,v,`iとData[i]を表示`,out.join(', '),{name:'Data',index:i}))}return{code:['Data = [{{data}}]','i を 0 から 要素数(Data) - 1 まで繰り返す:','｜ 表示する(i, Data[i])'],frames:fs}}
function buildExtremePos(s){const a=arrayOf(s.data),v={Data:a,saidai:a[0],ichi:0},fs=[frame(0,{Data:a},'配列Dataを用意'),frame(1,v,`Data[0]=${a[0]}を最初の最大値にする`,undefined,{name:'Data',index:0})];for(let i=1;i<a.length;i++){v.i=i;fs.push(frame(2,v,`Data[${i}]=${a[i]}を調べる`,undefined,{name:'Data',index:i}));const ok=compare(a[i],s.op,v.saidai);fs.push(frame(3,v,`${a[i]} ${s.op} ${v.saidai} は${ok?'真':'偽'}`,undefined,{name:'Data',index:i}));if(ok){v.saidai=a[i];v.ichi=i;fs.push(frame(4,v,`最大値を${a[i]}、位置を${i}へ更新`,undefined,{name:'Data',index:i}))}}fs.push(frame(5,v,'最大値と位置を表示',`${v.saidai}, ${v.ichi}`));return{code:['Data = [{{data}}]','saidai = Data[0], ichi = 0','i を 1 から 要素数(Data) - 1 まで繰り返す:','｜ もし Data[i] {{op}} saidai ならば:','｜ └ saidai = Data[i], ichi = i','表示する(saidai, ichi)'],frames:fs}}
const presets={pass:[0,0],sum:[0,1],multiples:[0,2],array:[1,0],max:[1,1],tie:[1,2]};
const [initialLesson,initialExercise]=Object.hasOwn(presets,location.hash.slice(1))?presets[location.hash.slice(1)]:[0,0];

let li=initialLesson,ei=initialExercise,step=0,timer=null,pred='',view='current',validationError='';const active={},draft={};const $=q=>document.querySelector(q);const outputScreen=$('#outputScreen');
function item(){return lessons[li].items[ei]}function taskKey(){return `${li}-${ei}`}function defaults(){return Object.fromEntries(item().fields.map(f=>[f.key,f.value]))}
function ensure(){active[taskKey()]??=defaults();draft[taskKey()]??={...active[taskKey()]}}
function build(){ensure();return item().build(active[taskKey()])}
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function field(k){return item().fields.find(f=>f.key===k)}
function editor(f){const val=draft[taskKey()][f.key];if(f.type==='select')return `<select class="edit" aria-label="比較演算子" data-key="${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input aria-label="${esc(fieldLabel(f.key))}" class="edit ${f.type==='array'?'array':''}" data-key="${f.key}" type="${f.type==='number'?'number':'text'}" value="${esc(val)}">`}
function codeLine(line){let out='',last=0,m,re=/\{\{(\w+)\}\}/g;while((m=re.exec(line))){out+=esc(line.slice(last,m.index))+editor(field(m[1]));last=m.index+m[0].length}return out+esc(line.slice(last))}
function changed(){ensure();return Object.keys(draft[taskKey()]).some(k=>String(draft[taskKey()][k])!==String(active[taskKey()][k]))}
function readEditors(){document.querySelectorAll('.edit').forEach(el=>draft[taskKey()][el.dataset.key]=el.value)}
function strictArray(v){const parts=String(v).split(/[、,\s]+/).filter(Boolean);return parts.length&&parts.every(x=>Number.isFinite(Number(x)))?parts.map(Number):null}
const FIELD_LABELS={score:'tokuten',cut:'判定基準',n:'繰り返し回数',initial:'goukeiの初期値',factor:'iに掛ける数',divisor:'割る数',data:'Data'};
function fieldLabel(k){return FIELD_LABELS[k]||k}
function validateDraft(){
 const d=draft[taskKey()],fs=item().fields;
 for(const f of fs){const raw=d[f.key];if(f.type==='number'){if(String(raw??'').trim()==='')return `${fieldLabel(f.key)}を入力してください。`;if(!Number.isFinite(Number(raw)))return `${fieldLabel(f.key)}には数値を入力してください。`}if(f.type==='array'){const a=strictArray(raw);if(!a)return `${fieldLabel(f.key)}には数値をカンマ区切りで入力してください。`;if(a.length>12)return `${fieldLabel(f.key)}の要素数は12個以内にしてください。`;}}
 for(const k of ['n','divisor'])if(k in d&&(!Number.isInteger(Number(d[k]))||Number(d[k])<1))return `${fieldLabel(k)}には1以上の整数を入力してください。`;
 if('n'in d&&Number(d.n)>30)return '繰り返し回数は30以下にしてください。';
 return ''
}
function showValidation(msg){validationError=msg;feedback.classList.add('error');feedback.textContent=msg}
function clearValidation(){validationError='';feedback.classList.remove('error')}
function clearFeedback(){clearValidation();feedback.textContent='';feedback.style.color=''}
function commitDraft(){readEditors();const msg=validateDraft();if(msg){showValidation(msg);return false}clearValidation();if(!changed())return false;active[taskKey()]={...draft[taskKey()]};step=0;stop();return true}
function stateAt(b){return step?b.frames[step-1]:{vars:{},log:'未実行'}}
function samePrediction(answer,actual){
 const normalize=text=>String(text).normalize('NFKC').trim().replace(/\s*([(),])\s*/g,'$1');
 const guess=normalize(answer),expected=normalize(actual);
 if(guess===expected)return true;
 // A pair of numbers may be written with or without surrounding parentheses.
 const unwrapPair=text=>text.replace(/^\(([-+]?\d+(?:\.\d+)?,[-+]?\d+(?:\.\d+)?)\)$/,'$1');
 return unwrapPair(guess)===unwrapPair(expected);
}
function finalFeedback(b){if(changed()||step<b.frames.length||!pred)return;const actual=b.frames.findLast(f=>f.out!==undefined)?.out??'';if(samePrediction(pred,actual)){feedback.style.color='var(--green)';feedback.textContent='予想と実行結果が一致しました。'}else{feedback.style.color='#b1432d';feedback.textContent=`予想：${pred} ／ 実際：${actual}。実行履歴から差が生じた行を確認できます。`}}
function returnToLabTop(){requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))}
function chooseExercise(i){ei=i;step=0;pred='';view='current';clearFeedback();stop();render();returnToLabTop()}
function nav(){tabs.innerHTML=lessons.map((l,i)=>`<button class="tab ${i===li?'active':''}" data-i="${i}">第${l.number}回　${l.title}</button>`).join('')+`<button class="tab" id="winterHome" type="button">問題に戻る</button>`;tabs.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{li=+b.dataset.i;ei=0;step=0;pred='';view='current';clearFeedback();stop();render();returnToLabTop()});document.getElementById('winterHome').onclick=()=>{location.href='index.html#task-'+Object.keys(presets).find(key=>presets[key][0]===li&&presets[key][1]===ei)};exerciseList.innerHTML=lessons[li].items.map((x,i)=>`<button class="exercise ${i===ei?'active':''}" data-i="${i}"><strong>${i+1}. ${x.title}</strong><span>${x.concept}</span></button>`).join('');exerciseList.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseExercise(+b.dataset.i));quickNav.innerHTML=lessons[li].items.map((x,i)=>`<button class="${i===ei?'active':''}" type="button" aria-label="問題${i+1}へ" aria-current="${i===ei?'true':'false'}">${i+1}</button>`).join('');quickNav.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>chooseExercise(i));const atFirst=ei===0,atLast=ei===lessons[li].items.length-1;[['#prevExercise',atFirst,ei-1],['#prevExerciseMain',atFirst,ei-1],['#nextExercise',atLast,ei+1],['#nextExerciseMain',atLast,ei+1]].forEach(([selector,disabled,target])=>{const button=$(selector);button.disabled=disabled;button.onclick=()=>chooseExercise(target)})}
function renderArrays(st){const entries=Object.entries(st.vars||{}).filter(([,v])=>Array.isArray(v));arrays.innerHTML=entries.map(([name,a])=>{const focus=st.focus?.name===name?st.focus.index:-1,start=a[0]==='—'?1:0,cells=a.slice(start).map((v,j)=>{const i=j+start;return `<div class="cell ${i===focus?'focus':''}"><div class="idx">${i}</div><div class="val">${esc(v)}</div></div>`}).join('');return `<div class="array-card"><div class="array-name">${esc(name)}</div><div class="array-grid">${cells}</div>${focus>=start?`<div class="focus-note">${esc(name)}[${focus}] = ${esc(a[focus])}</div>`:''}</div>`}).join('')}
function valueText(vars){return Object.entries(vars||{}).filter(([,v])=>!Array.isArray(v)).map(([k,v])=>`${k}=${v}`).join('，')||'—'}
function renderTrace(b){traceBody.innerHTML=step?b.frames.slice(0,step).map((f,i)=>`<tr><td>${i+1}</td><td>${f.line+1}</td><td>${esc(f.log)}</td><td>${esc(valueText(f.vars))}${f.out!==undefined?`<br>出力=${esc(f.out)}`:''}</td></tr>`).join(''):'<tr><td colspan="4" style="color:#7b879e">実行履歴はありません。</td></tr>'}
function render(){ensure();const l=lessons[li],x=item(),b=build(),st=stateAt(b),executed=new Set(b.frames.slice(0,step).map(f=>f.line)),nextLine=step<b.frames.length?b.frames[step].line:-1;round.textContent=`第${l.number}回`;lessonTitle.textContent=l.title;goal.textContent=l.goal;taskTitle.textContent=x.title;question.textContent=x.question;concept.textContent=`${x.concept}｜${ei+1}/${l.items.length}`;code.innerHTML=b.code.map((line,i)=>`<div class="line ${executed.has(i)?'done':''} ${i===nextLine?'now':''}" data-n="${i+1}">${codeLine(line)}</div>`).join('');code.querySelectorAll('.edit').forEach(el=>{el.oninput=updateDraft;el.onchange=updateDraft});dirty.classList.toggle('show',changed());renderArrays(st);const scalar=Object.entries(st.vars||{}).filter(([,v])=>!Array.isArray(v));vars.innerHTML=scalar.length?scalar.map(([k,v])=>{const prev=step>1?b.frames[step-2]?.vars?.[k]:undefined;const shown=v===undefined?'—':v;return `<tr><th>${esc(k)}</th><td><span class="${prev!==v?'changed':''}">${esc(shown)}</span></td></tr>`}).join(''):'<tr><td style="color:#7b879e">—</td></tr>';log.textContent=st.log;outputScreen.textContent=st.out??(step?b.frames.slice(0,step).reverse().find(f=>f.out!==undefined)?.out:'')??'—';hint.innerHTML=`<b>確認事項：</b> ${esc(x.hint)}`;bar.style.width=`${b.frames.length?Math.round(step/b.frames.length*100):0}%`;counter.textContent=`${step} / ${b.frames.length}`;back.disabled=step===0;next.disabled=step>=b.frames.length&&!changed();auto.disabled=next.disabled;prediction.value=pred;renderTrace(b);currentView.hidden=view!=='current';traceView.hidden=view!=='trace';document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));nav();finalFeedback(b)}
function updateDraft(event){
 const editor=event.target;
 draft[taskKey()][editor.dataset.key]=editor.value;
 stop();
 clearFeedback();
 const pending=changed();
 dirty.classList.toggle('show',pending);
 next.disabled=step>=build().frames.length&&!pending;
 auto.disabled=next.disabled;
}
function stop(){clearInterval(timer);timer=null;if($('#auto'))auto.textContent='連続実行'}
function prepareRun(){const wasChanged=commitDraft();if(validationError)return null;if(wasChanged){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初から実行します。'}return build()}
restore.onclick=()=>{active[taskKey()]=defaults();draft[taskKey()]={...active[taskKey()]};step=0;pred='';clearValidation();stop();feedback.textContent='元の設定に戻しました。';render()};reset.onclick=()=>{commitDraft();if(validationError)return;step=0;stop();feedback.textContent=pred?'予想は保持されています。':'';render()};back.onclick=()=>{stop();if(commitDraft()){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初に戻りました。';render();return}if(validationError)return;if(step>0){step--;clearFeedback()}render()};next.onclick=()=>{stop();const b=prepareRun();if(!b)return;if(step<b.frames.length)step++;render()};auto.onclick=()=>{if(timer){stop();return}let b=prepareRun();if(!b||step>=b.frames.length)return;render();auto.textContent='一時停止';timer=setInterval(()=>{b=build();if(step>=b.frames.length){stop();render();return}step++;if(step>=b.frames.length)stop();render()},650)};
const workspaceEl=document.getElementById('workspace'),exerciseToggle=document.getElementById('exerciseToggle');function setExerciseNav(collapsed){workspaceEl.classList.toggle('exercise-collapsed',collapsed);exerciseToggle.textContent=collapsed?'問題一覧を開く':'問題一覧を閉じる';exerciseToggle.setAttribute('aria-expanded',String(!collapsed));}setExerciseNav(matchMedia('(max-width:1100px)').matches);exerciseToggle.onclick=()=>setExerciseNav(!workspaceEl.classList.contains('exercise-collapsed'));
check.onclick=()=>{pred=prediction.value.trim();feedback.style.color=pred?'#155eef':'#9a5c00';feedback.textContent=pred?'この予想を実行結果と比較します。':'予想を入力してください。';finalFeedback(build())};prediction.oninput=e=>pred=e.target.value;document.querySelectorAll('.view-tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName)){if(e.key==='Enter'){e.preventDefault();if(e.target===prediction)check.click();else e.target.blur()}return}if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')back.click();if(e.key.toLowerCase()==='r')reset.click()});render();
</script>
</body></html>
