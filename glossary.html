<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報Ⅰ 用語集</title><style>
:root{--navy:#172846;--ink:#172033;--muted:#657187;--line:#d8e0ea;--paper:#f4f7fb;--accent:#207a66;--soft:#e8f5f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.head{padding:28px clamp(18px,4vw,54px) 22px;background:var(--navy);color:#fff}.head small{font-size:11px;font-weight:800;letter-spacing:.14em;color:#8ed5c4}.head h1{margin:7px 0 5px;font-size:clamp(24px,3vw,36px)}.head p{margin:0;color:#cbd5e5;font-size:14px}.tools{position:sticky;top:0;z-index:3;padding:14px clamp(18px,4vw,54px);background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.search{display:flex;gap:10px;max-width:840px}.search input{min-width:0;flex:1;padding:12px 14px;border:1px solid #aebdce;border-radius:9px;font-size:16px}.count{display:grid;place-items:center;min-width:76px;border-radius:9px;background:var(--soft);color:#176452;font-size:12px;font-weight:800}.filters{display:flex;gap:7px;margin-top:10px;overflow:auto}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 11px;color:#47566d;font-weight:700;cursor:pointer}.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}.main{max-width:1180px;margin:auto;padding:22px clamp(18px,4vw,54px) 50px}.intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:11px}.card{padding:16px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 2px 10px #2639580b}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.term{margin:0;font-size:18px}.tag{padding:4px 7px;border-radius:999px;background:var(--soft);color:#176452;font-size:10px;font-weight:800}.definition{margin:10px 0 8px;line-height:1.72;font-size:14px}.point{padding-top:9px;border-top:1px solid #edf0f4;color:#5d687a;font-size:12px;line-height:1.6}.point b{color:#2e405b}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:600px){.head{padding-top:22px}.grid{grid-template-columns:1fr}.count{min-width:62px}.main{padding-top:16px}}
</style></head><body><header class="head"><small>INFORMATION I / TERMS</small><h1>用語集</h1><p>第1〜4回の演習範囲を、定義と設問上の着眼点で整理</p></header><section class="tools"><div class="search"><input id="query" type="search" placeholder="用語・説明から検索" autocomplete="off"><div class="count" id="count"></div></div><div class="filters" id="filters"></div></section><main class="main"><p class="intro">定義だけでなく、似た概念との違いや設問で確認すべき点も掲載しています。検索語と分野で絞り込めます。</p><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>該当する用語がありません。</div></main><script src="terms-data.js"></script><script>
const terms=window.INFO_TERMS;
const categories=['すべて',...new Set(terms.map(x=>x[0]))];let category='すべて';const q=document.getElementById('query'),grid=document.getElementById('grid'),count=document.getElementById('count'),empty=document.getElementById('empty'),filters=document.getElementById('filters');q.value=new URLSearchParams(location.search).get('q')||'';
filters.innerHTML=categories.map((x,i)=>`<button class="filter${i?'':' active'}" data-cat="${x}">${x}</button>`).join('');filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});q.addEventListener('input',render);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const key=q.value.trim().toLowerCase(),list=terms.filter(x=>(category==='すべて'||x[0]===category)&&(!key||x.join(' ').toLowerCase().includes(key)));count.textContent=`${list.length}語`;grid.innerHTML=list.map(x=>`<article class="card"><div class="meta"><h2 class="term">${esc(x[1])}</h2><span class="tag">${esc(x[0])}</span></div><p class="definition">${esc(x[2])}</p><div class="point"><b>設問上の着眼点：</b>${esc(x[3])}</div></article>`).join('');empty.hidden=!!list.length}render();
</script></body></html>
