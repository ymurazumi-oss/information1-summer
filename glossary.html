<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報Ⅰ 用語集</title><style>
:root{--navy:#172846;--ink:#172033;--muted:#657187;--line:#d8e0ea;--paper:#f4f7fb;--accent:#207a66;--soft:#e8f5f1;--example:#f7f9fc;--analogy:#fff8e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.head{padding:28px clamp(18px,4vw,54px) 22px;background:var(--navy);color:#fff}.head small{font-size:11px;font-weight:800;letter-spacing:.14em;color:#8ed5c4}.head h1{margin:7px 0 5px;font-size:clamp(24px,3vw,36px)}.head p{margin:0;color:#cbd5e5;font-size:14px}.tools{position:sticky;top:0;z-index:3;padding:14px clamp(18px,4vw,54px);background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.toolrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.search{display:flex;gap:10px;max-width:840px;flex:1}.search input{min-width:0;flex:1;padding:12px 14px;border:1px solid #aebdce;border-radius:9px;font-size:16px}.count{display:grid;place-items:center;min-width:76px;border-radius:9px;background:var(--soft);color:#176452;font-size:12px;font-weight:800}.views{display:flex;flex:0 0 auto;padding:3px;border:1px solid var(--line);border-radius:10px;background:#f5f7fa}.view{border:0;border-radius:7px;background:transparent;padding:8px 11px;color:#5d687a;font-weight:800;cursor:pointer}.view.active{background:#fff;color:#176452;box-shadow:0 1px 4px #26395818}.filters{display:flex;gap:7px;margin-top:10px;overflow:auto}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 11px;color:#47566d;font-weight:700;cursor:pointer}.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}.main{max-width:1180px;margin:auto;padding:22px clamp(18px,4vw,54px) 50px}.intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}.grid{display:grid;gap:12px;align-items:start}.grid.cards{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}.card{padding:16px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 2px 10px #2639580b}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.term{margin:0;font-size:18px}.tag{padding:4px 7px;border-radius:999px;background:var(--soft);color:#176452;font-size:10px;font-weight:800}.definition{margin:10px 0 8px;line-height:1.72;font-size:14px}.context{display:grid;gap:7px;margin:10px 0}.context div{padding:9px 10px;border-radius:8px;font-size:12px;line-height:1.65}.context b{display:block;margin-bottom:2px;color:#2e405b;font-size:11px}.example{background:var(--example);border-left:3px solid #7a8ca7}.analogy{background:var(--analogy);border-left:3px solid #d59b18}.point{padding-top:9px;border-top:1px solid #edf0f4;color:#5d687a;font-size:12px;line-height:1.6}.point b{color:#2e405b}.grid.list{grid-template-columns:1fr;gap:9px}.grid.list .card{display:grid;grid-template-columns:minmax(145px,185px) minmax(0,1fr);grid-template-rows:auto auto;column-gap:22px;row-gap:7px;padding:16px 18px}.grid.list .meta{grid-column:1;grid-row:1 / span 2;align-items:flex-start;justify-content:flex-start;flex-direction:column}.grid.list .tag{margin-top:4px}.grid.list .definition{grid-column:2;grid-row:1;margin:0;font-size:14px;line-height:1.65}.grid.list .support{grid-column:2;grid-row:2}.grid.list .context{display:block;margin:0}.grid.list .context .example{padding:8px 10px}.grid.list .analogy{display:none}.grid.list .point{margin-top:7px;padding-top:7px}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:800px){.toolrow{align-items:stretch;flex-direction:column}.views{align-self:flex-end}.grid.cards{grid-template-columns:1fr}.grid.list .card{display:block}.grid.list .meta{display:flex;flex-direction:row;justify-content:space-between;margin-bottom:7px}.grid.list .definition{margin:4px 0 8px}.grid.list .support{display:block}.grid.list .context{display:block}.count{min-width:62px}}@media(max-width:600px){.head{padding-top:22px}.main{padding-top:16px}.view{padding:8px 13px}}
</style></head><body><header class="head"><small>INFORMATION I / TERMS</small><h1>用語集</h1><p>定義を、身近な場面やイメージと結び付けて整理</p></header><section class="tools"><div class="toolrow"><div class="search"><input id="query" type="search" placeholder="用語・意味・身近な例から検索" autocomplete="off"><div class="count" id="count"></div></div><div class="views" aria-label="表示形式"><button class="view" type="button" data-view="list" aria-pressed="true">☷ 一覧</button><button class="view" type="button" data-view="cards" aria-pressed="false">▦ カード</button></div></div><div class="filters" id="filters"></div></section><main class="main"><p class="intro">一覧表示は素早い検索に、カード表示は例やたとえを含めた学習に向いています。</p><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>該当する用語がありません。</div></main><script src="terms-data.js"></script><script>
const terms=window.INFO_TERMS;
const categories=['すべて',...new Set(terms.map(x=>x[0]))];let category='すべて',view=localStorage.getItem('infoGlossaryView')||'list';if(!['list','cards'].includes(view))view='list';const q=document.getElementById('query'),grid=document.getElementById('grid'),count=document.getElementById('count'),empty=document.getElementById('empty'),filters=document.getElementById('filters'),views=document.querySelector('.views');q.value=new URLSearchParams(location.search).get('q')||'';
filters.innerHTML=categories.map((x,i)=>`<button class="filter${i?'':' active'}" data-cat="${x}">${x}</button>`).join('');filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});q.addEventListener('input',render);
views.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;localStorage.setItem('infoGlossaryView',view);setView()});function setView(){grid.className=`grid ${view}`;document.querySelectorAll('.view').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const key=q.value.trim().toLowerCase(),contexts=window.INFO_TERM_CONTEXT||{},list=terms.filter(x=>{const extra=contexts[x[1]]||[];return(category==='すべて'||x[0]===category)&&(!key||[...x,...extra].join(' ').toLowerCase().includes(key))});count.textContent=`${list.length}語`;grid.innerHTML=list.map(x=>{const extra=contexts[x[1]],context=extra?`<div class="context"><div class="example"><b>身近な例</b>${esc(extra[0])}</div><div class="analogy"><b>たとえるなら</b>${esc(extra[1])}</div></div>`:'';return`<article class="card"><div class="meta"><h2 class="term">${esc(x[1])}</h2><span class="tag">${esc(x[0])}</span></div><p class="definition">${esc(x[2])}</p><div class="support">${context}<div class="point"><b>設問上の着眼点：</b>${esc(x[3])}</div></div></article>`}).join('');empty.hidden=!!list.length}setView();render();
</script></body></html>
