name: Finish approved UI copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-ui-copy.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the usage note visible on every device
        run: |
          for file in programming.html info.html; do
            perl -0pi -e 's~<button class="action" id="openBtn" title="印刷・全画面表示用">教材だけを開く</button>~<button class="action" id="openBtn">教材だけを開く<br><small style="display:block;font-size:10px;font-weight:600;color:#667085">印刷・全画面表示用</small></button>~g' "$file"
          done
          test "$(grep -l '印刷・全画面表示用</small>' programming.html info.html | wc -l)" -eq 2
      - name: Remove this one-time workflow
        run: rm .github/workflows/finish-ui-copy.yml
      - name: Commit the approved changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programming.html info.html .github/workflows/finish-ui-copy.yml
          git commit -m "Show the standalone-view purpose on all devices"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
