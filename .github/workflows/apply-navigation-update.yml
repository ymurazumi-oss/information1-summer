name: Apply navigation update

on:
  push:
    paths:
      - .github/workflows/apply-navigation-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update course headers
        shell: python
        run: |
          from pathlib import Path

          files = {
              "programming.html": (
                  '<header class="top"><div class="top-left"><button class="nav-toggle" id="navToggle" type="button" aria-label="教材メニューを閉じる" aria-expanded="true">☰</button><div class="brand"><div class="brand-mark">Ⅰ</div><div><b>情報Ⅰ 共通テスト演習</b><small>プログラミング</small></div></div></div><a class="home" href="index.html"><span class="home-label">分野選択へ戻る</span><span class="home-label-short">戻る</span></a></header>',
                  '<header class="top"><div class="top-left"><button class="nav-toggle" id="navToggle" type="button" aria-label="教材メニューを閉じる" aria-expanded="true">☰</button><a class="brand" href="index.html" aria-label="教材一覧へ戻る"><div class="brand-mark">Ⅰ</div><div><b>情報Ⅰ 共通テスト演習</b><small>プログラミング</small></div></a></div><a class="home" href="index.html"><span class="home-label">教材一覧</span><span class="home-label-short">一覧</span></a></header>',
              ),
              "info.html": (
                  '<header class="top"><div class="top-left"><button class="nav-toggle" id="navToggle" type="button" aria-label="教材メニューを閉じる" aria-expanded="true">☰</button><div class="brand"><div class="brand-mark">Ⅰ</div><div><b>情報Ⅰ 共通テスト演習</b><small>情報Ⅰ 基礎・データ活用</small></div></div></div><a class="home" href="index.html"><span class="home-label">分野選択へ戻る</span><span class="home-label-short">戻る</span></a></header>',
                  '<header class="top"><div class="top-left"><button class="nav-toggle" id="navToggle" type="button" aria-label="教材メニューを閉じる" aria-expanded="true">☰</button><a class="brand" href="index.html" aria-label="教材一覧へ戻る"><div class="brand-mark">Ⅰ</div><div><b>情報Ⅰ 共通テスト演習</b><small>情報Ⅰ 基礎・データ活用</small></div></a></div><a class="home" href="index.html"><span class="home-label">教材一覧</span><span class="home-label-short">一覧</span></a></header>',
              ),
          }
          old_css = ".brand{display:flex;align-items:center;gap:12px}"
          new_css = ".brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;border-radius:10px}.brand:focus-visible{outline:3px solid #ffffff80;outline-offset:4px}"
          for filename, (old_header, new_header) in files.items():
              path = Path(filename)
              content = path.read_text()
              assert content.count(old_css) == 1, filename + " CSS mismatch"
              assert content.count(old_header) == 1, filename + " header mismatch"
              path.write_text(content.replace(old_css, new_css).replace(old_header, new_header))
          Path(".github/workflows/apply-navigation-update.yml").unlink()
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programming.html info.html .github/workflows/apply-navigation-update.yml
          git commit -m "Make course headers return to the course list"
          git push
