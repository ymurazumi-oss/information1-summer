<section id="setup"><h1>知識確認</h1><p class="lead">復習したい回・難易度・問題数を自分で選びます。解答後に、短い解説を確認できます。</p><div class="card settings">

<div class="setting"><h2>問題数</h2><div class="choices" id="counts"><label class="pick"><input type="radio" name="count" value="5"><span>5問</span></label><label class="pick"><input type="radio" name="count" value="10" checked><span>10問</span></label><label class="pick"><input type="radio" name="count" value="20"><span>20問</span></label><label class="pick"><input type="radio" name="count" value="0"><span>該当する全問</span></label></div><p class="available" id="available"></p></div>

<section id="play" class="hidden"><div class="quiz-head"><div><div class="progress" id="progress"></div><div class="bar"><i id="bar"></i></div></div><button class="secondary" id="quit">設定に戻る</button></div><div class="card"><div class="qmeta" id="qmeta"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div><div class="nextrow"><button id="next" class="primary hidden">次の問題</button></div></div></section>

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function freshQuestionOrder(list){let order=shuffle(list),signature=order.map(q=>q.id).join('\u001f');if(order.length>1&&signature===lastQuestionOrder){order=[...order.slice(1),order[0]];signature=order.map(q=>q.id).join('\u001f')}lastQuestionOrder=signature;return order}

function pool(c){return bank.filter(q=>c.rounds.includes(q.round)&&(c.level==='混合'||q.level===c.level))}
function readWrongIds(){try{const raw=JSON.parse(localStorage.getItem('infoQuizWrong')||'[]');const valid=new Set(bank.map(q=>q.id));return new Set(Array.isArray(raw)?raw.filter(id=>valid.has(id)):[])}catch(e){return new Set()}}
function updateSetup(){const c=config(),n=pool(c).length;$('available').textContent=n?'この条件では'+n+'問から出題できます。':'この条件に合う問題はありません。';document.querySelectorAll('#counts input').forEach(input=>{input.disabled=+input.value>0&&+input.value>n});const checked=document.querySelector('[name=count]:checked');if(checked&&checked.disabled){const choices=[20,10,5].filter(x=>x<=n);document.querySelector('[name=count][value="'+(choices[0]||0)+'"]').checked=true}const ids=readWrongIds();$('historyStart').classList.toggle('hidden',!ids.size);$('historyStartText').textContent='保存されている間違えた問題：'+ids.size+'問'}

function startStoredWrong(){const ids=readWrongIds(),list=bank.filter(q=>ids.has(q.id));if(list.length)begin(shuffle(list),{rounds:[1,2,3,4],count:0,level:'混合'},list)}
function render(){locked=false;const q=selected[pos];$('progress').textContent=(pos+1)+' / '+selected.length+'問';$('bar').style.width=((pos+1)/selected.length*100)+'%';$('qmeta').textContent='第'+q.round+'回｜'+q.field+'｜'+q.level;$('question').textContent=q.text;$('feedback').className='feedback hidden';$('next').classList.add('hidden');const order=freshChoiceOrder(q);$('answers').innerHTML='';order.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>answer(b,o.original);$('answers').appendChild(b)})}
function answer(btn,choice){if(locked)return;locked=true;const q=selected[pos],ok=choice===q.answer;if(ok)correct++;else wrong.push(q);document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===q.choices[q.answer])b.classList.add('correct')});if(!ok)btn.classList.add('wrong');$('feedback').className='feedback '+(ok?'ok':'ng');$('feedback').innerHTML='<b>'+(ok?'正解':'不正解')+'</b><br>'+q.explain;$('next').textContent=pos===selected.length-1?'結果を見る':'次の問題';$('next').classList.remove('hidden')}
function next(){if(pos<selected.length-1){pos++;render()}else finish()}
function finish(){const ids=readWrongIds();wrong.forEach(q=>ids.add(q.id));selected.filter(q=>!wrong.includes(q)).forEach(q=>ids.delete(q.id));localStorage.setItem('infoQuizWrong',JSON.stringify([...ids]));show('result');$('score').textContent=correct+' / '+selected.length;$('summary').textContent=correct===selected.length?'全問正解です。':'間違えた'+wrong.length+'問は、解説を確認してからもう一度挑戦できます。';const rounds=[...new Set(selected.map(q=>q.round))];$('breakdown').innerHTML=rounds.map(r=>{const qs=selected.filter(q=>q.round===r),ng=wrong.filter(q=>q.round===r).length;return '<div><b>第'+r+'回</b><br>'+(qs.length-ng)+' / '+qs.length+'問</div>'}).join('');$('retryWrong').disabled=!wrong.length;$('retryWrong').style.opacity=wrong.length?1:.45;$('history').textContent='この端末に残っている未正解の問題：'+ids.size+'問'}
function back(){show('setup')}
document.querySelectorAll('#rounds input,[name=level]').forEach(x=>x.addEventListener('change',updateSetup));$('start').onclick=start;$('startWrong').onclick=startStoredWrong;$('next').onclick=next;$('quit').onclick=back;$('backSetup').onclick=back;$('sameAgain').onclick=()=>{const p=shuffle(repeatSource||pool(lastConfig)),count=repeatSource?p.length:(lastConfig.count===0?p.length:Math.min(lastConfig.count,p.length));begin(p.slice(0,count),lastConfig,repeatSource)};$('retryWrong').onclick=()=>{if(wrong.length){const list=[...wrong];begin(shuffle(list),lastConfig,list)}};updateSetup();
</script></body></html>
