<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プログラミング ミニ演習</title>
<style>
:root{--navy:#182b4d;--blue:#287bb5;--green:#1e795e;--red:#b23a3a;--ink:#172033;--muted:#647089;--line:#d9e1ec;--paper:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{padding:20px 24px;background:var(--navy);color:#fff}.top h1{margin:0 0 4px;font-size:23px}.top p{margin:0;color:#d8e1ef;font-size:13px}.wrap{max-width:820px;margin:22px auto;padding:0 16px}.status{display:flex;align-items:center;gap:12px;margin-bottom:12px}.bar{height:8px;flex:1;overflow:hidden;border-radius:999px;background:#dce4ee}.bar span{display:block;height:100%;background:var(--blue);transition:width .25s}.progress{font-size:13px;font-weight:800;white-space:nowrap}.card{padding:22px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 18px #2538580c}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:13px}.tag{padding:4px 8px;border-radius:999px;background:#e8f4ef;color:#176247;font-size:11px;font-weight:800}.level{color:var(--muted);font-size:12px}.question{margin:0 0 14px;font-size:18px;line-height:1.65}.code{margin:12px 0 18px;padding:14px 16px;border-left:4px solid #70a9ce;border-radius:9px;background:#f0f5fa;font:15px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.answer-row{display:flex;gap:9px}.answer{min-width:0;flex:1;padding:12px 13px;border:1px solid #b9c6d8;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}.feedback{display:none;margin-top:16px;padding:13px 15px;border-radius:9px;line-height:1.65}.feedback.ok{display:block;background:#eaf7f1;color:#155f47}.feedback.ng{display:block;background:#fff0ef;color:#842e2e}.related{display:block;margin-top:6px;font-size:12px}.next-row{display:none;justify-content:flex-end;margin-top:14px}.next-row.show{display:flex}.result{text-align:center}.score{margin:10px 0 4px;font-size:46px;font-weight:900;color:var(--navy)}.summary{margin:0 auto 20px;max-width:550px;color:#4d5870;line-height:1.7}.restart{background:var(--green)}.hint{margin-top:12px;color:var(--muted);font-size:12px}.setup h2{margin:0 0 7px;font-size:22px}.setup-lead{margin:0 0 20px;color:var(--muted);line-height:1.7}.settings{display:grid;gap:17px}.setting-group{border:0;margin:0;padding:0}.setting-group legend{margin-bottom:8px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:grid;place-items:center;min-height:47px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#46516a;font-weight:800;cursor:pointer}.choice input:checked+span{border-color:var(--blue);background:#eaf4fb;color:#155d8c;box-shadow:inset 0 0 0 1px var(--blue)}.range-choices{grid-template-columns:repeat(5,1fr)}.setup-actions{display:flex;justify-content:flex-end;margin-top:22px}.start-btn{min-width:150px;padding:13px 20px}.config-note{margin-top:12px;color:var(--muted);font-size:12px}.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.secondary{background:#fff;color:#40506a;border:1px solid var(--line)}@media(max-width:650px){.choices,.range-choices{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{padding:17px 16px}.card{padding:17px}.answer-row{display:grid}.btn{width:100%}.question{font-size:16px}.code{font-size:14px}.setup-actions{display:block}.result-actions{display:grid}}
</style>
</head>
<body>
<header class="top"><h1>プログラミング ミニ演習</h1><p>難易度・問題数・範囲を選んで、毎回変わる問題に挑戦</p></header>
<main class="wrap"><div id="app"></div></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=R(0,i);[b[i],b[j]]=[b[j],b[i]]}return b};
const sumTo=n=>n*(n+1)/2;
const make=(lesson,level,factory)=>({lesson,level,factory});
const templates=[
 make(1,'basic',()=>{const a=R(2,12),b=R(2,12);return{cat:'代入',q:'最後に表示される値を答えなさい。',code:`x = ${a}\nx = x + ${b}\n表示する(x)`,ans:a+b,ex:`${a} に ${b} を加えるので ${a+b}。`,term:'代入・更新'}}),
 make(1,'basic',()=>{const a=R(2,9),b=R(2,9),c=R(2,5);return{cat:'順次構造',q:'最後に表示される値を答えなさい。',code:`x = ${a}\nx = x * ${c}\nx = x - ${b}\n表示する(x)`,ans:a*c-b,ex:`上から順に、${a} → ${a*c} → ${a*c-b}。`,term:'順次構造・トレース'}}),
 make(1,'basic',()=>{const t=R(55,80),s=t+pick([-5,-1,0,1,6]);return{cat:'条件分岐',q:'表示される言葉を「合格」か「不合格」で答えなさい。',code:`tokuten = ${s}\nもし tokuten >= ${t} ならば:\n  表示する("合格")\nそうでなければ:\n  表示する("不合格")`,ans:s>=t?'合格':'不合格',ex:`${s} >= ${t} は${s>=t?'真':'偽'}。`,term:'条件式・境界値'}}),
 make(1,'standard',()=>{const n=R(4,10);return{cat:'反復',q:`1から${n}までの整数を合計した値を答えなさい。`,code:`goukei = 0\ni を 1 から ${n} まで繰り返す:\n  goukei = goukei + i\n表示する(goukei)`,ans:sumTo(n),ex:`1+2+…+${n} = ${sumTo(n)}。`,term:'反復構造・更新'}}),
 make(1,'standard',()=>{const d=R(2,5),end=R(12,24),xs=Array.from({length:end},(_,i)=>i+1).filter(x=>x%d===0),ans=xs.reduce((s,x)=>s+x,0);return{cat:'条件＋反復',q:`1から${end}までの${d}の倍数だけを合計した値を答えなさい。`,code:`goukei = 0\ni を 1 から ${end} まで繰り返す:\n  もし i % ${d} == 0 ならば:\n    goukei = goukei + i\n表示する(goukei)`,ans,ex:`対象は ${xs.join('、')}。合計は ${ans}。`,term:'剰余・条件分岐・反復'}}),
 make(1,'advanced',()=>{const a=R(2,8),n=R(3,6);let x=a;for(let i=1;i<=n;i++)x=i%2===0?x+i:x*2;return{cat:'複合更新',q:'最後に表示される x の値を答えなさい。',code:`x = ${a}\ni を 1 から ${n} まで繰り返す:\n  もし i % 2 == 0 ならば:\n    x = x + i\n  そうでなければ:\n    x = x * 2\n表示する(x)`,ans:x,ex:`i の偶奇に応じて、加算と2倍を順番に行うと ${x}。`,term:'分岐を含む反復・トレース'}}),
 make(2,'basic',()=>{const arr=Array.from({length:5},()=>R(1,19)),one=Math.random()<.5,index=one?R(1,5):R(0,4);return{cat:'配列',q:`添字は${one?'1':'0'}から始まります。Data[${index}] の値を答えなさい。`,code:`Data = [${arr.join(', ')}]`,ans:arr[one?index-1:index],ex:`左から${one?index:index+1}番目の値を読む。`,term:'配列・要素・添字'}}),
 make(2,'basic',()=>{const arr=Array.from({length:5},()=>R(1,12)),ans=arr.reduce((s,x)=>s+x,0);return{cat:'配列の合計',q:'最後の goukei の値を答えなさい。',code:`Data = [${arr.join(', ')}]\ngoukei = 0\ni を 0 から 4 まで繰り返す:\n  goukei = goukei + Data[i]`,ans,ex:`配列の全要素を加えると ${ans}。`,term:'配列・合計'}}),
 make(2,'standard',()=>{const arr=Array.from({length:6},()=>R(1,15)),xs=arr.filter(x=>x%2===0),ans=xs.reduce((s,x)=>s+x,0);return{cat:'条件付き集計',q:'最後の goukei の値を答えなさい。',code:`Data = [${arr.join(', ')}]\ngoukei = 0\ni を 0 から 5 まで繰り返す:\n  もし Data[i] % 2 == 0 ならば:\n    goukei = goukei + Data[i]`,ans,ex:`偶数 ${xs.length?xs.join('、'):'なし'} の合計は ${ans}。`,term:'配列・条件付き集計'}}),
 make(2,'standard',()=>{const arr=Array.from({length:6},()=>R(1,9)),target=R(3,7),ans=arr.filter(x=>x>=target).length;return{cat:'個数の集計',q:`${target}以上の要素はいくつありますか。`,code:`Data = [${arr.join(', ')}]\nkosuu = 0\ni を 0 から 5 まで繰り返す:\n  もし Data[i] >= ${target} ならば:\n    kosuu = kosuu + 1`,ans,ex:`条件を満たす要素は ${ans} 個。`,term:'配列・カウント'}}),
 make(2,'advanced',()=>{const arr=Array.from({length:6},()=>R(1,12));let ans=0;for(let i=1;i<arr.length;i++)if(arr[i]>arr[i-1])ans++;return{cat:'隣接比較',q:'最後の kosuu の値を答えなさい。',code:`Data = [${arr.join(', ')}]\nkosuu = 0\ni を 1 から 5 まで繰り返す:\n  もし Data[i] > Data[i-1] ならば:\n    kosuu = kosuu + 1`,ans,ex:`直前の要素より大きい箇所は ${ans} 個。`,term:'配列・隣接要素・添字'}}),
 make(3,'basic',()=>{const arr=Array.from({length:5},()=>R(1,19)),ans=Math.max(...arr);return{cat:'最大値探索',q:'最後の saidai の値を答えなさい。',code:`Data = [${arr.join(', ')}]\nsaidai = Data[0]\ni を 1 から 4 まで繰り返す:\n  もし Data[i] > saidai ならば:\n    saidai = Data[i]`,ans,ex:`最大値は ${ans}。`,term:'最大値探索・初期化'}}),
 make(3,'basic',()=>{const a=R(3,20),b=R(3,20);return{cat:'関数',q:'x の値を答えなさい。最大値(a,b) は大きい方を返します。',code:`x = 最大値(${a}, ${b})`,ans:Math.max(a,b),ex:`${a} と ${b} の大きい方は ${Math.max(a,b)}。`,term:'関数・引数・戻り値'}}),
 make(3,'standard',()=>{const arr=Array.from({length:6},()=>R(1,18)),max=Math.max(...arr),ans=arr.indexOf(max);return{cat:'最大値の位置',q:'最後の ichi の値を答えなさい（添字は0から）。',code:`Data = [${arr.join(', ')}]\nsaidai = Data[0]\nichi = 0\ni を 1 から 5 まで繰り返す:\n  もし Data[i] > saidai ならば:\n    saidai = Data[i]\n    ichi = i`,ans,ex:`最大値 ${max} が最初に現れる添字は ${ans}。`,term:'最大値探索・添字'}}),
 make(3,'standard',()=>{const arrival=[0,R(2,5),R(6,9)],finish=[R(2,4),R(7,10),R(11,14)];const waits=arrival.map((a,i)=>Math.max(0,(i?finish[i-1]:0)-a)),ans=Math.max(...waits);return{cat:'待ち時間',q:'最も長い待ち時間を答えなさい。',code:`Touchaku = [${arrival.join(', ')}]\nShuryou = [${finish.join(', ')}]\n待ち時間[i] = 最大値(0, Shuryou[i-1] - Touchaku[i])`,ans,ex:`待ち時間は ${waits.join('、')} なので最大は ${ans}。`,term:'配列・待ち時間・最大値'}}),
 make(3,'advanced',()=>{const m=R(8,18),arr=[R(1,m-1),m,R(1,m-1),m,R(1,m-1)],op=pick(['>','>=']),ans=op==='>'?1:3;return{cat:'同じ最大値',q:'最後の ichi の値を答えなさい（添字は0から）。',code:`Data = [${arr.join(', ')}]\nsaidai = Data[0]\nichi = 0\ni を 1 から 4 まで繰り返す:\n  もし Data[i] ${op} saidai ならば:\n    saidai = Data[i]\n    ichi = i`,ans,ex:`条件が ${op} なので、同じ最大値のとき${op==='>'?'更新せず最初':'も更新して最後'}の位置 ${ans} が残る。`,term:'比較演算子・同値の扱い'}}),
 make(4,'basic',()=>{const outer=R(2,5),inner=R(2,6);return{cat:'二重ループ',q:'「●」は全部で何回表示されますか。',code:`k を 1 から ${outer} まで繰り返す:\n  i を 1 から ${inner} まで繰り返す:\n    表示する("●")`,ans:outer*inner,ex:`${outer}×${inner}=${outer*inner} 回。`,term:'二重ループ'}}),
 make(4,'basic',()=>{const arr=Array.from({length:5},()=>R(1,20)),ans=Math.min(...arr);return{cat:'最小値探索',q:'最後の saisyou の値を答えなさい。',code:`Data = [${arr.join(', ')}]\nsaisyou = Data[0]\ni を 1 から 4 まで繰り返す:\n  もし Data[i] < saisyou ならば:\n    saisyou = Data[i]`,ans,ex:`最小値は ${ans}。`,term:'最小値探索・初期化'}}),
 make(4,'standard',()=>{const outer=R(2,5),inner=R(3,7),d=R(2,3);let ans=0;for(let k=1;k<=outer;k++)for(let i=1;i<=inner;i++)if((k+i)%d===0)ans++;return{cat:'二重ループ＋条件',q:'「●」は全部で何回表示されますか。',code:`k を 1 から ${outer} まで繰り返す:\n  i を 1 から ${inner} まで繰り返す:\n    もし (k + i) % ${d} == 0 ならば:\n      表示する("●")`,ans,ex:`条件を満たす組を数えると ${ans} 回。`,term:'二重ループ・条件分岐'}}),
 make(4,'standard',()=>{const arr=Array.from({length:4},()=>R(2,8)),bonus=R(1,4);let ans=arr[0];for(let i=1;i<4;i++)ans=arr[i]>ans?arr[i]+bonus:ans;return{cat:'探索と更新',q:'最後の value の値を答えなさい。',code:`Data = [${arr.join(', ')}]\nvalue = Data[0]\ni を 1 から 3 まで繰り返す:\n  もし Data[i] > value ならば:\n    value = Data[i] + ${bonus}`,ans,ex:`比較に使う value 自体が更新される点に注意して追うと ${ans}。`,term:'探索・更新後の値'}}),
 make(4,'advanced',()=>{const n=R(4,7),a=R(1,4);let x=a,y=0;for(let i=1;i<=n;i++){x+=i;if(x%2===0)y+=x;else y-=1}return{cat:'長いトレース',q:'最後に表示される y の値を答えなさい。',code:`x = ${a}\ny = 0\ni を 1 から ${n} まで繰り返す:\n  x = x + i\n  もし x % 2 == 0 ならば:\n    y = y + x\n  そうでなければ:\n    y = y - 1\n表示する(y)`,ans:y,ex:`各回の x の更新後に偶奇を判定して追うと ${y}。`,term:'長いプログラム・トレース'}})
];
const app=document.getElementById('app');
const levelLabel={basic:'基礎',standard:'標準',advanced:'発展',random:'おまかせ'};
let settings={difficulty:'standard',count:10,range:'all'},questions=[],pos=0,score=0,answered=false,missed=[],running=false;
const norm=s=>String(s).trim().replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248));
function setup(){running=false;answered=false;app.innerHTML=`<section class="card setup"><h2>演習の設定</h2><p class="setup-lead">目的に合わせて、難易度・問題数・出題範囲を選んでください。</p><div class="settings"><fieldset class="setting-group"><legend>難易度</legend><div class="choices">${[['basic','基礎'],['standard','標準'],['advanced','発展'],['random','おまかせ']].map(([v,l])=>`<label class="choice"><input type="radio" name="difficulty" value="${v}" ${settings.difficulty===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset><fieldset class="setting-group"><legend>問題数</legend><div class="choices">${[5,10,15,20].map(v=>`<label class="choice"><input type="radio" name="count" value="${v}" ${settings.count===v?'checked':''}><span>${v}問</span></label>`).join('')}</div></fieldset><fieldset class="setting-group"><legend>出題範囲</legend><div class="choices range-choices">${[['all','すべて'],['1','第1回'],['2','第2回'],['3','第3回'],['4','第4回']].map(([v,l])=>`<label class="choice"><input type="radio" name="range" value="${v}" ${String(settings.range)===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset></div><div class="setup-actions"><button id="begin" class="btn start-btn">演習を始める</button></div><div class="config-note">標準は基礎を含む実戦的な問題、発展は複数の処理を組み合わせた問題です。</div></section>`;document.getElementById('begin').onclick=begin}
function pool(){const levels=settings.difficulty==='basic'?['basic']:settings.difficulty==='standard'?['basic','standard']:settings.difficulty==='advanced'?['standard','advanced']:['basic','standard','advanced'];return templates.filter(t=>(settings.range==='all'||t.lesson===Number(settings.range))&&levels.includes(t.level))}
function makeQuestions(){const source=pool(),out=[];while(out.length<settings.count){for(const t of shuffle(source)){out.push({...t.factory(),lesson:`第${t.lesson}回`,difficulty:levelLabel[t.level]});if(out.length===settings.count)break}}return out}
function begin(){settings={difficulty:document.querySelector('[name="difficulty"]:checked').value,count:Number(document.querySelector('[name="count"]:checked').value),range:document.querySelector('[name="range"]:checked').value};questions=makeQuestions();pos=0;score=0;answered=false;missed=[];running=true;render()}
function render(){const q=questions[pos],total=questions.length;app.innerHTML=`<div class="status"><div class="bar"><span style="width:${pos/total*100}%"></span></div><div class="progress">${pos+1} / ${total}</div></div><section class="card"><div class="meta"><span class="tag">${q.cat}</span><span class="level">${q.difficulty}・夏期講習 ${q.lesson}</span></div><h2 class="question">${q.q}</h2><div class="code">${q.code}</div><div class="answer-row"><input id="answer" class="answer" inputmode="text" autocomplete="off" placeholder="答えを入力"><button id="check" class="btn">答え合わせ</button></div><div id="feedback" class="feedback"></div><div id="nextRow" class="next-row"><button id="next" class="btn">${pos===total-1?'結果を見る':'次の問題'}</button></div><div class="hint">Enterキーでも答え合わせ・次の問題へ進めます。</div></section>`;document.getElementById('answer').focus();document.getElementById('check').onclick=check;document.getElementById('next').onclick=next}
function check(){if(answered)return;const q=questions[pos],input=document.getElementById('answer'),given=norm(input.value);if(!given)return input.focus();answered=true;const ok=given===norm(q.ans);if(ok)score++;else missed.push(q.term);input.disabled=true;document.getElementById('check').disabled=true;const f=document.getElementById('feedback');f.className=`feedback ${ok?'ok':'ng'}`;f.innerHTML=`<b>${ok?'正解！':'正解は「'+q.ans+'」'}</b><br>${q.ex}${ok?'':`<span class="related">確認する用語：${q.term} ／ 夏期講習 ${q.lesson}</span>`}`;document.getElementById('nextRow').classList.add('show')}
function next(){if(!answered)return check();if(pos<questions.length-1){pos++;answered=false;render()}else result()}
function result(){running=false;const total=questions.length,rate=score/total,unique=[...new Set(missed)],message=rate===1?'全問正解です。数値が変わっても処理を正しく追えています。':rate>=.7?'基本はつかめています。間違えた問題の処理をもう一度追ってみましょう。':'各行の実行直後の値を書きながら復習しましょう。';app.innerHTML=`<section class="card result"><span class="tag">演習完了</span><div class="score">${score} / ${total}</div><p class="summary">${levelLabel[settings.difficulty]}・${settings.range==='all'?'全範囲':`第${settings.range}回`}<br>${message}${unique.length?`<br><b>確認したい用語：</b>${unique.join('、')}`:''}</p><div class="result-actions"><button id="retry" class="btn restart">同じ設定でもう一度</button><button id="change" class="btn secondary">設定を変更する</button></div></section>`;document.getElementById('retry').onclick=()=>{questions=makeQuestions();pos=0;score=0;answered=false;missed=[];running=true;render()};document.getElementById('change').onclick=setup}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.repeat||!running)return;e.preventDefault();answered?next():check()});
setup();
</script>
</body>
</html>
