<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プログラミング用語｜DNCL</title>
<style>
:root{--navy:#182b4d;--ink:#172033;--muted:#657089;--line:#dce3ee;--paper:#f4f7fb;--blue:#1769aa;--soft:#eaf7ff;--warn:#805000}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{padding:22px 28px;background:var(--navy);color:#fff}.top h1{margin:0 0 5px;font-size:24px}.top p{margin:0;color:#d5dfed;font-size:13px}.tools{position:sticky;top:0;z-index:5;padding:14px 22px;background:#fffc;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.search-row{display:flex;align-items:center;gap:9px;max-width:1180px;margin:auto}.search{flex:1;min-width:0;padding:11px 13px;border:1px solid #b9c6d8;border-radius:9px;background:#fff;font-size:15px}.count{padding:8px 11px;border-radius:999px;background:#e8f4ef;color:#176247;font-size:12px;font-weight:800;white-space:nowrap}.filters{display:flex;gap:7px;max-width:1180px;margin:10px auto 0;overflow:auto}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 11px;color:#46516a;font-weight:700;cursor:pointer}.filter.active{background:#26745f;border-color:#26745f;color:#fff}.intro{max-width:1180px;margin:16px auto 0;padding:0 22px;color:#536079;font-size:13px;line-height:1.7}.list{max-width:1180px;margin:12px auto 28px;padding:0 22px;display:grid;gap:9px}.term{display:grid;grid-template-columns:180px minmax(260px,1.3fr) minmax(260px,1fr);gap:18px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 8px #2639580a}.name h2{margin:0 0 8px;font-size:18px}.cat{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f5ef;color:#176247;font-size:10px;font-weight:800}.meaning{line-height:1.75;font-size:14px}.details{display:grid;gap:8px;font-size:13px}.code{padding:9px 11px;border-left:3px solid #6aaed8;border-radius:7px;background:#f3f7fb;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.note{color:var(--warn);line-height:1.6}.lab{color:#536079;font-size:11px}.empty{padding:50px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px}
@media(max-width:800px){.top{padding:17px 16px}.top h1{font-size:21px}.tools{padding:10px}.intro,.list{padding-left:10px;padding-right:10px}.term{grid-template-columns:1fr;gap:10px;padding:14px}.name{display:flex;align-items:center;gap:9px}.name h2{margin:0}.details{border-top:1px solid #edf0f5;padding-top:9px}}
@media print{.tools{position:static}.filter{display:none}.term{break-inside:avoid;box-shadow:none}.list{max-width:none}}
</style>
</head>
<body>
<header class="top"><h1>プログラミング用語</h1><p>DNCLを読むための基本語を、コードと演習につなげて確認する</p></header>
<section class="tools"><div class="search-row"><input class="search" id="search" placeholder="用語・意味・コードから検索" autocomplete="off"><span class="count" id="count"></span></div><div class="filters" id="filters"></div></section>
<p class="intro">用語を暗記して終わりにせず、DNCLのどの表記や処理に当たるかを確かめよう。添字の始まりや関数の仕様などは、必ず各問題の説明を優先します。</p>
<main class="list" id="list"></main>
<script src="programming-terms-data.js"></script>
<script>
const terms=window.PROGRAMMING_TERMS||[],cats=['すべて',...new Set(terms.map(x=>x[0]))];let active='すべて';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function render(){const q=search.value.trim().toLowerCase(),shown=terms.filter(t=>(active==='すべて'||t[0]===active)&&(!q||t.join(' ').toLowerCase().includes(q)));count.textContent=`${shown.length}語`;list.innerHTML=shown.map(t=>`<article class="term"><div class="name"><h2>${esc(t[1])}</h2><span class="cat">${esc(t[0])}</span></div><div class="meaning">${esc(t[2])}</div><div class="details"><div class="code">${esc(t[3])}</div><div class="note">注意：${esc(t[4])}</div><div class="lab">夏期講習 ${esc(t[5])}</div></div></article>`).join('')||'<div class="empty">該当する用語はありません。</div>';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.cat===active))}
filters.innerHTML=cats.map(c=>`<button class="filter" data-cat="${esc(c)}">${esc(c)}</button>`).join('');filters.onclick=e=>{const b=e.target.closest('button');if(!b)return;active=b.dataset.cat;render()};search.oninput=render;render();
</script>
</body>
</html>
